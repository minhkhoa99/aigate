    - { code: PROVIDER_UNAVAILABLE, when: "Vercel deployment creation call itself returns non-ok", partial: false }
    - { code: TIMEOUT, when: "pollDeployment exceeds 120000ms without reaching READY/ERROR/CANCELED", partial: true }
