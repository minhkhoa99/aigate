  sideEffects: []
  persistence: []
  performanceConcerns:
    - "One DB read (getProxyPoolById) per credential resolution when a proxyPoolId is set — same hot-path-no-cache pattern already noted for settings.hot-path-read-no-cache"
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
