# Trace: Proxy Pools — the outbound transport chain, proxy-pool CRUD/rotation, and the
# Vercel/Cloudflare/Deno relay-deploy routes (Task 15). 9router reference read at
# E:\9router. Read-only; every evidence line was read directly, not inferred from names
# (behavioral.md §7).
#
# Scope note: src/lib/db/repos/proxyPoolsRepo.js is a plain JSON-blob-over-SQLite repo
# (same shape as connection.storage-shape-json-blob in 03-accounts-multiaccount.yaml) —
# only its proxy-pool-specific fields (strictProxy, type) are new; the generic
# rowToPool/poolToRow shape is cited but not re-derived.
# account.select-noauth-virtual-connection (03-accounts-multiaccount.yaml) already traces
# the noAuth branch of getProviderCredentials() down to pickProxyPoolId() — this file
# extends that trace into resolveConnectionProxyConfig()'s priority order and the proxy
# CRUD/deploy surface, and cites 03's entry as a dependency rather than re-tracing auth.js.
# settings.outbound-proxy-live-apply (01-endpoint-apikey-settings.yaml) traces the global
# HTTP_PROXY/HTTPS_PROXY env-var path read by getEnvProxyUrl() here — cited, not re-traced.
#
# Empirical check for Q5 (this task's brief): a Node v22.19 script reproducing
# createBypassRequest()'s exact pattern (plain net.Socket -> https.request({ socket,
# servername })) was run against a real TLS host. It confirmed (a) the response socket is
# encrypted (res.socket.encrypted === true) and (b) a deliberately wrong `servername`
# causes an SSL handshake failure — i.e. https.request() DOES wrap a passed net.Socket in a
# real TLS session keyed off `servername`, so the inline comment's claim (SNI + cert checked
# against the original hostname) holds. Recorded as REFERENCE_BEHAVIOR, not a bug.

- id: transport.proxy-priority-chain
  group: Proxy Pools
  feature: Proxy-aware outbound fetch
  subFeature: proxyAwareFetch() dispatch priority chain
  trigger: Every outbound provider/executor HTTP call routed through proxyAwareFetch(url, options, proxyOptions) instead of raw fetch
  input: "target url; fetch options; proxyOptions ({ connectionProxyEnabled, connectionProxyUrl, connectionNoProxy, vercelRelayUrl, strictProxy } or null)"
  output: "A Response — either relayed through a deployed Vercel/Cloudflare/Deno function, dispatched through an undici ProxyAgent, sent via a manual DNS-bypass socket, or sent as a direct fetch"
  businessRules:
    - "Priority order, evaluated in this sequence: (1) proxyOptions.vercelRelayUrl, if non-empty, short-circuits everything else — the request is forwarded to the relay URL with x-relay-target/x-relay-path headers added, unconditionally, before any proxy/MITM logic runs; (2) connectionProxyUrl = resolveConnectionProxyUrl(targetUrl, proxyOptions) — only non-null when proxyOptions.enabled or proxyOptions.connectionProxyEnabled is exactly true AND a URL is present AND the target host is not matched by proxyOptions.noProxy/connectionNoProxy; (3) envProxyUrl is computed ONLY when connectionProxyUrl is null (a per-connection pool proxy always wins over HTTP_PROXY/HTTPS_PROXY/ALL_PROXY env vars, and env lookup itself honors NO_PROXY/no_proxy); (4) proxyUrl = connectionProxyUrl || envProxyUrl"
    - "If the target host is in MITM_BYPASS_HOSTS: with a proxyUrl present, it tries the proxy first (return on success); on proxy failure it falls through (not returns) to the manual-DNS-bypass branch, which resolves the real IP via Google DNS and opens a direct raw-socket HTTPS request to that IP with the original hostname as TLS servername/Host"
    - "If that manual-bypass branch also fails (DNS resolve fails, or realIP is falsy, or createBypassRequest throws), execution falls out of the MITM block entirely and re-enters the generic `if (proxyUrl)` branch below — meaning a MITM host with a working proxyUrl and a failing bypass gets a SECOND proxy dispatch attempt through the same dispatcher before finally falling back to a plain direct fetch"
    - "For non-MITM hosts (the common case): if proxyUrl is set, dispatch through the cached undici ProxyAgent; if proxyUrl is unset, call the original (unpatched) global fetch directly — got-scraping/TLS-fingerprinting is present in the file but fully commented out (dead code), so no JA3 spoofing occurs at all despite the file header describing it"
  state:
    reads: ["proxyOptions param (per-request, not global state)", "process.env.HTTP_PROXY/HTTPS_PROXY/ALL_PROXY/NO_PROXY (only when no connection-level proxy)"]
    writes: []
    runtimeOnly: ["proxyDispatchers Map and DNS_CACHE Map — both module-scope, see transport.proxy-dispatcher-cache"]
  dependencies: ["settings.outbound-proxy-live-apply"]
  providerInteraction: "Every executor's upstream API call for every provider goes through this function"
  fallback: { hasFallback: true, retry: null, timeout: null, quota: null }
  errorCases:
    - { code: PROVIDER_UNAVAILABLE, when: "proxy dispatch throws and strictProxy is not exactly true — caught, logged, silently falls back to a direct fetch (see transport.strict-proxy-fallback)", partial: false }
  sideEffects: ["Reassigns globalThis.fetch to a patched wrapper at module load (idempotency-guarded)"]
  persistence: []
  performanceConcerns:
    - "Commented-out got-scraping block (lines 11-98) is ~90 lines of dead code kept 'for future re-enable' — no functional cost but adds file-read/parse weight and reviewer confusion about whether JA3 spoofing is active"
  behavior: { streaming: false, cancellation: "options.signal is passed through untouched to whichever transport is chosen", concurrency: null }
  edgeCases:
    - "A MITM-bypass host that also has a proxy configured can attempt the SAME proxy twice (once inside the MITM block, once in the generic block) before giving up, because the fallthrough after the manual-bypass failure does not skip the already-tried proxyUrl"
  evidence:
    - { file: open-sse/utils/proxyFetch.js, line: 294, note: "proxyAwareFetch signature" }
    - { file: open-sse/utils/proxyFetch.js, line: 298, note: "vercelRelayUrl short-circuit, checked before anything else" }
    - { file: open-sse/utils/proxyFetch.js, line: 309, note: "connectionProxyUrl computed first" }
    - { file: open-sse/utils/proxyFetch.js, line: 310, note: "envProxyUrl only computed when connectionProxyUrl is null" }
    - { file: open-sse/utils/proxyFetch.js, line: 314, note: "shouldBypassMitmDns(targetUrl) gate" }
    - { file: open-sse/utils/proxyFetch.js, line: 315, note: "proxy attempted first inside the MITM branch" }
    - { file: open-sse/utils/proxyFetch.js, line: 324, note: "fallthrough (no return) to manual bypass on proxy failure" }
    - { file: open-sse/utils/proxyFetch.js, line: 337, note: "generic if (proxyUrl) branch runs again after the MITM block, even on the second attempt path" }
    - { file: open-sse/utils/proxyFetch.js, line: 353, note: "final direct originalFetch(url, options) when nothing else applied" }
  newModule: transport
  parityStatus: contracted
  labels: [REFERENCE_BEHAVIOR]

- id: transport.strict-proxy-fallback
  group: Proxy Pools
  feature: Proxy-aware outbound fetch
  subFeature: strictProxy — hard-fail vs silent direct fallback on proxy dispatch failure
  trigger: proxyUrl is set and the undici ProxyAgent dispatch throws (proxy unreachable, auth failure, connection refused, etc.)
  input: "proxyOptions.strictProxy (boolean, sourced from a proxy pool's strictProxy field)"
  output: "Either a thrown Error (request fails visibly) or a silent retry of the same URL with a plain direct fetch (no proxy, no error to the caller)"
  businessRules:
    - "strictProxy only gates the two explicit `if (proxyOptions?.strictProxy === true) throw` sites in proxyFetch.js, both immediately after a caught proxy-dispatch error — it does not affect any other branch (vercel relay, MITM manual-bypass failure, or the 'no proxy configured at all' path)"
    - "With strictProxy anything other than exactly true (false, undefined, missing), a dead/unreachable proxy is caught, a console.warn is emitted, and the SAME request is silently retried via the unpatched direct fetch — the caller receives a normal response with no indication the proxy was bypassed"
    - "SUSPECTED_BUG: the primary chat-completion request path (open-sse/handlers/chatCore.js, the code every /v1 chat request goes through) builds its proxyOptions object WITHOUT a strictProxy field at all, so `proxyOptions?.strictProxy === true` is always false on that path regardless of what a proxy pool's strictProxy toggle is set to. Three sibling call sites that also build a proxyOptions object DO set the field explicitly: antigravityQuota.js propagates the resolved value faithfully (strictProxy: proxyCfg.strictProxy === true); usage/[connectionId]/route.js and codex-reset-credits/route.js force it to false with an explicit code comment explaining the choice ('force strictProxy=false so quota/refresh fall back to direct on failure'). chatCore.js has no such comment and no such field — it reads as an omission, not a deliberate choice, and it means the strictProxy toggle can never actually enforce anything for real model traffic, only for the three secondary (quota/refresh) paths that already deliberately ignore it"
  state:
    reads: ["proxyOptions.strictProxy per call"]
    writes: []
    runtimeOnly: []
  dependencies: ["transport.proxy-priority-chain"]
  providerInteraction: "Determines whether a failed provider proxy silently degrades to direct connection for every provider request"
  fallback: { hasFallback: true, retry: null, timeout: null, quota: null }
  errorCases:
    - { code: PROVIDER_UNAVAILABLE, when: "strictProxy === true and proxy dispatch fails", partial: false }
  sideEffects: ["When falling back silently, the request egresses from the server's own IP instead of the configured pool's IP — a policy/security-relevant behavior change with no signal to the caller or to logs beyond a console.warn"]
  persistence: []
  performanceConcerns: []
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "resolveConnectionProxyConfig() itself defaults strictProxy to false inside its own catch-all error handler (source: 'error' branch) — so a transient DB read error while resolving the proxy config ALSO silently disables strict enforcement for that request, on top of the chatCore.js omission"
  evidence:
    - { file: open-sse/utils/proxyFetch.js, line: 321, note: "MITM-branch proxy failure: throw only if strictProxy === true" }
    - { file: open-sse/utils/proxyFetch.js, line: 343, note: "generic-branch proxy failure: throw only if strictProxy === true" }
    - { file: open-sse/utils/proxyFetch.js, line: 346, note: "non-strict path: warn + silent direct fallback, same URL, no proxy" }
    - { file: open-sse/handlers/chatCore.js, line: 320, note: "proxyOptions built for the main chat path — connectionProxyEnabled/Url/NoProxy/vercelRelayUrl only, no strictProxy key" }
    - { file: src/sse/services/antigravityQuota.js, line: 113, note: "sibling call site that DOES propagate strictProxy from the resolved config" }
    - { file: "src/app/api/usage/[connectionId]/route.js", line: 148, note: "sibling call site that explicitly forces strictProxy: false, with a comment explaining why" }
    - { file: "src/app/api/usage/[connectionId]/codex-reset-credits/route.js", line: 72, note: "third sibling call site, also forces strictProxy: false explicitly" }
    - { file: src/lib/network/connectionProxy.js, line: 184, note: "resolveConnectionProxyConfig's catch-all error path also defaults strictProxy: false" }
  newModule: transport
  parityStatus: traced
  labels: [SUSPECTED_BUG]
  suspicion:
    expected: "A proxy pool with strictProxy enabled should cause real model-traffic requests through that pool to fail (not silently go direct) when the proxy is unreachable, matching what the dashboard toggle promises and what the other three call sites (antigravityQuota, usage, codex-reset-credits) already do with the same field"
    actual: "chatCore.js — the handler behind every /v1 chat/completions request — builds its proxyOptions without a strictProxy key at all, so proxyAwareFetch's `proxyOptions?.strictProxy === true` check is always false for the main request path regardless of the pool's configured value"
    impact: "An operator who enables strictProxy specifically to guarantee traffic never leaves without the configured proxy (e.g. to hide the server's real egress IP from upstream providers) gets no such guarantee for actual chat requests — a dead proxy silently falls back to a direct connection from the box's own IP, with only a console.warn as a trace, defeating the stated purpose of the toggle on the one path that matters most"

- id: transport.mitm-dns-bypass
  group: Proxy Pools
  feature: Proxy-aware outbound fetch
  subFeature: MITM_BYPASS_HOSTS — manual DNS resolution + raw-socket TLS to dodge local DNS/hosts poisoning
  trigger: proxyAwareFetch() called with a target URL whose hostname matches (via substring `includes`) one of MITM_BYPASS_HOSTS
  input: "target hostname"
  output: "A Response obtained either through the configured proxy (dispatcher) or, if no proxy, through a manually-constructed HTTPS request to the real (Google-DNS-resolved) IP"
  businessRules:
    - "MITM_BYPASS_HOSTS = cloudcode-pa.googleapis.com, daily-cloudcode-pa.googleapis.com, api.individual.githubcopilot.com, q.us-east-1.amazonaws.com, codewhisperer.us-east-1.amazonaws.com, api2.cursor.sh — exactly the upstream API hosts used by 9router's own antigravity/cloudcode, GitHub Copilot, kiro/codewhisperer, and cursor executors"
    - "These are the same hostnames src/mitm/ rewrites in the OS hosts file / local DNS (per src/shared/constants/mitmToolHosts.js) to intercept IDE traffic for its own capture feature. When 9router's own outbound executor calls hit the SAME hostnames on a machine where the MITM feature is active, the OS-level resolution would route them into the local MITM interceptor instead of the real provider — this bypass exists so the router's own provider traffic is unaffected by whatever DNS/hosts state the MITM capture feature has put the machine in"
    - "DNS resolution uses a dedicated Node dns.Resolver pinned to Google's public servers (8.8.8.8, 8.8.4.4), not the system resolver, specifically to avoid the poisoned /etc/hosts or local resolver"
    - "TLS is still fully established and validated: the resolved real IP is used only for the raw TCP connect; the TLS `servername` (SNI) and the Host header are set to the ORIGINAL hostname, not the IP — confirmed empirically (see file header) that https.request() wraps the raw net.Socket in a genuine TLS session keyed to `servername`, and a mismatched servername causes a handshake failure. So certificate-hostname validation is preserved against the real target host; this bypass only sidesteps the DNS/hosts layer, not TLS trust"
  state:
    reads: ["DNS_CACHE (module-scope Map, TTL-bounded, see below)"]
    writes: ["DNS_CACHE entries"]
    runtimeOnly: ["DNS_CACHE — lost on restart, repopulated on first bypass request per host"]
  dependencies: []
  providerInteraction: "Google DNS (8.8.8.8/8.8.4.4) for resolution; the real provider host for the actual request"
  fallback: { hasFallback: true, retry: null, timeout: null, quota: null }
  errorCases:
    - { code: PROVIDER_UNAVAILABLE, when: "DNS resolve fails, or the raw-socket HTTPS request errors", partial: false }
  sideEffects: []
  persistence: []
  performanceConcerns:
    - "DNS_CACHE entries live 5 minutes (MEMORY_CONFIG.dnsCacheTtlMs) — a real DNS change for one of these six hosts can take up to 5 minutes to be picked up"
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "shouldBypassMitmDns() matches via `hostname.includes(host)`, a substring match rather than an exact/suffix match — a hostname that merely CONTAINS one of the six strings (e.g. as a subdomain prefix an attacker controls, though none of the current six are attacker-triggerable substrings of common domains) would also match"
  evidence:
    - { file: open-sse/utils/proxyFetch.js, line: 102, note: "MITM_BYPASS_HOSTS list" }
    - { file: open-sse/utils/proxyFetch.js, line: 110, note: "GOOGLE_DNS_SERVERS = 8.8.8.8, 8.8.4.4" }
    - { file: open-sse/utils/proxyFetch.js, line: 123, note: "resolveRealIP — dns.Resolver pinned to Google DNS, 5-minute cache" }
    - { file: open-sse/utils/proxyFetch.js, line: 145, note: "shouldBypassMitmDns — substring hostname match against MITM_BYPASS_HOSTS" }
    - { file: open-sse/utils/proxyFetch.js, line: 248, note: "createBypassRequest — raw net.Socket.connect(HTTPS_PORT, realIP, ...)" }
    - { file: open-sse/utils/proxyFetch.js, line: 257, note: "servername: parsedUrl.hostname passed into https.request — SNI/cert-hostname intent, empirically confirmed correct (see file header)" }
  newModule: transport
  parityStatus: traced
  labels: [REFERENCE_BEHAVIOR]

- id: transport.proxy-dispatcher-cache
  group: Proxy Pools
  feature: Proxy-aware outbound fetch
  subFeature: Cached undici ProxyAgent dispatchers, keyed by normalized proxy URL
  trigger: getDispatcher(proxyUrl) called from either branch of proxyAwareFetch that needs to dispatch through a proxy
  input: "normalized proxy URL string"
  output: "A cached (or newly-created) undici ProxyAgent instance"
  businessRules:
    - "Bounded by count only (MEMORY_CONFIG.proxyDispatchersMaxSize = 20), never by time — there is no TTL/expiry for an entry once created; an entry only leaves the Map when the cache is full AND a brand-new proxy URL needs to be inserted"
    - "Eviction is FIFO by insertion order, not true LRU: `proxyDispatchers.keys().next().value` always deletes the oldest-INSERTED entry (Map iteration order), and a cache HIT on an existing key does not re-insert/move it — so a frequently-reused proxy that happens to be old still gets evicted ahead of a rarely-used one that was added more recently"
    - "An evicted ProxyAgent is only dropped from the Map reference — nothing calls .close()/.destroy() on it, unlike the one-off tester dispatcher in proxyTest.js which explicitly closes its ProxyAgent in a finally block. Sockets/connections held by an evicted-but-still-open agent are left to be reclaimed by GC/keep-alive timeout rather than an explicit close"
  state:
    reads: []
    writes: ["proxyDispatchers Map"]
    runtimeOnly: ["proxyDispatchers — module-scope Map, lost on restart"]
  dependencies: ["transport.proxy-priority-chain"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: ["Holds up to 20 live undici ProxyAgent instances (each with its own connection pool) in memory for the process lifetime"]
  persistence: []
  performanceConcerns:
    - "An unbounded or never-expiring cache would leak; this one is size-bounded (20) but time-unbounded and does not close evicted agents — worth flagging even though not a full leak, since a stale ProxyAgent for a now-dead/rotated proxy pool can sit unused-but-un-closed until evicted by count pressure alone"
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "normalizeProxyUrl() allows bare host:port (e.g. '127.0.0.1:7890') by prepending 'http://' — two logically-different proxy configs that normalize to the same string share one cache entry/dispatcher"
  evidence:
    - { file: open-sse/utils/proxyFetch.js, line: 219, note: "getDispatcher — cache lookup, size check, eviction, ProxyAgent construction" }
    - { file: open-sse/utils/proxyFetch.js, line: 226, note: "size-bounded FIFO eviction: delete oldest key when at MEMORY_CONFIG.proxyDispatchersMaxSize" }
    - { file: open-sse/config/runtimeConfig.js, line: 31, note: "proxyDispatchersMaxSize: 20 — no TTL field exists alongside it" }
    - { file: src/lib/network/proxyTest.js, line: 86, note: "contrast: the one-off test dispatcher IS explicitly closed in a finally block" }
  newModule: transport
  parityStatus: traced
  labels: [REFERENCE_BEHAVIOR]

- id: transport.connection-proxy-config-priority
  group: Proxy Pools
  feature: Connection proxy resolution
  subFeature: resolveConnectionProxyConfig() — pool vs legacy vs none priority
  trigger: Called with a connection's (or a synthetic noAuth connection's) providerSpecificData, once per credential resolution (getProviderCredentials in auth.js) or per background quota/usage/reset-credits call
  input: "providerSpecificData: { proxyPoolId, connectionProxyEnabled, connectionProxyUrl, connectionNoProxy } (legacy fields kept for pre-proxy-pool connections)"
  output: "A normalized { source, proxyPoolId, proxyPool, connectionProxyEnabled, connectionProxyUrl, connectionNoProxy, strictProxy, vercelRelayUrl? } object"
  businessRules:
    - "Priority, in order: (1) proxyPoolId — if set (and not the sentinel '__none__'), the pool is looked up by id; only used if the pool exists, isActive === true, and has a non-empty proxyUrl (an inactive or URL-less pool is treated as if proxyPoolId were absent, falling through to legacy); (2) legacy connectionProxyEnabled+connectionProxyUrl on the connection itself; (3) no proxy at all"
    - "A valid pool of type vercel/cloudflare/deno returns connectionProxyEnabled: false and instead sets vercelRelayUrl to the pool's proxyUrl — these three types are header-relay proxies, not HTTP_PROXY-style proxies, so they must NOT go through the undici ProxyAgent dispatch path; a plain 'http' pool type returns connectionProxyEnabled: true / connectionProxyUrl set, for the ProxyAgent path"
    - "Any error during resolution (e.g. a DB read failure fetching the pool) is caught and degrades to source: 'error' with everything disabled (connectionProxyEnabled: false, strictProxy: false) rather than propagating — the caller always gets a valid object shape, never a rejected promise"
  state:
    reads: ["proxyPools table (via getProxyPoolById)"]
    writes: []
    runtimeOnly: []
  dependencies: ["account.select-noauth-virtual-connection"]
  providerInteraction: null
  fallback: { hasFallback: true, retry: null, timeout: null, quota: null }
  errorCases:
