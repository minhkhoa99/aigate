    writes: ["proxyPools table (only on full success)"]
    runtimeOnly: []
  dependencies: ["proxypool.crud-list-and-create", "transport.proxy-priority-chain"]
  providerInteraction: "Vercel REST API (api.vercel.com) — deployment creation, project-settings PATCH, deployment-status polling"
  fallback: { hasFallback: false, retry: null, timeout: "120000ms total, 3000ms poll interval, no retry after timeout/error — the whole deploy attempt just fails", quota: null }
  errorCases:
