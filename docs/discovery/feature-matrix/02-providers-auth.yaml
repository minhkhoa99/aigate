- id: auth.transport-auth-combined-bearer
  group: Provider authentication
  feature: Provider authentication
  subFeature: "transport.auth: { combined: true, header: \"Authorization\", scheme: \"bearer\" } — the majority-case header"
  trigger: Any chat request routed through DefaultExecutor for a provider whose transport.auth uses scheme \"bearer\"
  input: "credentials.apiKey or credentials.accessToken"
  output: "Authorization: Bearer <token> header, always set (even when both apiKey and accessToken are absent, producing the literal string \"Bearer undefined\")"
  businessRules:
    - "AUTH_DESCRIPTORS is built once from Object.entries(PROVIDERS).filter(([,t]) => t.auth) — only providers that declare a transport.auth block at all get an entry; providers without one fall through to resolveAuthDescriptor's hardcoded default (also BEARER unless the provider's format is \"claude\" or its id starts with \"anthropic-compatible-\")"
    - "combined:true means a single header always carries whichever of apiKey/accessToken is truthy (apiKey preferred): setAuth always writes the header even if the resulting value is `Bearer undefined` for a misconfigured/noAuth-flagged connection — this is legacy behavior the code comment explicitly calls out as intentional parity with the pre-refactor implementation"
    - "This is by far the most common shape in the registry — every plain \"apikey\"-category chat provider that doesn't override format defaults to combined Bearer unless it explicitly declares otherwise"
  state:
    reads: ["PROVIDERS[provider].auth (built once at module load)"]
    writes: []
    runtimeOnly: []
  dependencies: ["catalog.registry-build"]
  providerInteraction: "Sets the Authorization header on the outbound request to that provider's API"
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: []
  persistence: []
  performanceConcerns: []
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "A connection with neither apiKey nor accessToken set (should not normally exist, but the code has no defensive check here) still gets an Authorization header sent upstream with the literal value \"Bearer undefined\" rather than the request being rejected client-side before the fetch"
  evidence:
    - { file: open-sse/executors/default.js, line: 14, note: "AUTH_DESCRIPTORS built from PROVIDERS entries that declare .auth" }
    - { file: open-sse/executors/default.js, line: 21, note: "setAuth — Bearer prefix only when scheme === \"bearer\", raw token otherwise" }
    - { file: open-sse/executors/default.js, line: 27, note: "applyAuth combined branch — always sets the header, comment: legacy behavior incl. noAuth -> Bearer undefined" }
    - { file: open-sse/providers/registry/deepseek.js, line: 34, note: "combined bearer example" }
  newModule: connections
  parityStatus: traced
  labels: [REFERENCE_BEHAVIOR]

- id: auth.transport-auth-combined-raw
  group: Provider authentication
  feature: Provider authentication
  subFeature: "transport.auth: { combined: true, header: \"x-api-key\"|other, scheme: \"raw\" } — token sent unprefixed"
  trigger: Any chat request routed through DefaultExecutor for a provider whose transport.auth uses scheme \"raw\"
  input: "credentials.apiKey or credentials.accessToken"
  output: "<header-name>: <token> with no scheme prefix (e.g. x-api-key: sk-... rather than Bearer sk-...)"
