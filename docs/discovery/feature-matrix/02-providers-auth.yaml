- id: catalog.registry-frozen-after-load
  group: Providers
  feature: Provider catalog
  subFeature: Whether PROVIDERS / PROVIDER_OAUTH / PROVIDER_MEDIA are ever mutated after the initial build
  trigger: Any runtime read of PROVIDERS[id] / PROVIDER_OAUTH[id] / PROVIDER_MEDIA[id] anywhere in the app
  input: none
  output: "The same object references built once at module load; no code path writes to them afterward"
  businessRules:
    - "A repo-wide search for assignment into PROVIDERS[...]/PROVIDER_OAUTH[...]/PROVIDER_MEDIA[...] (the bracket-index `= ` pattern) finds exactly the three assignment sites inside providers/index.js's own build loop — no other file in src/ or open-sse/ ever writes to these objects"
    - "The objects are plain mutable JS objects, not Object.freeze()'d — nothing technically prevents a future caller from mutating PROVIDERS.foo.baseUrl at runtime, but no current caller does; every other module only reads (PROVIDERS[provider], PROVIDER_OAUTH[provider], PROVIDER_MEDIA[provider])"
    - "Per-connection data (API keys, OAuth tokens, providerSpecificData) lives entirely in the providerConnections DB table, never on the PROVIDERS registry object — the registry describes the provider (shared across every connection to it), the DB row describes one credential"
  state:
    reads: ["PROVIDERS/PROVIDER_OAUTH/PROVIDER_MEDIA module objects, in-memory, every request"]
    writes: []
    runtimeOnly: ["PROVIDERS/PROVIDER_OAUTH/PROVIDER_MEDIA — process-lifetime, rebuilt only by a process restart or module re-evaluation"]
  dependencies: ["catalog.registry-build"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: []
  persistence: []
  performanceConcerns:
    - "Because nothing is frozen, a coding mistake that does `PROVIDERS[id].something = x` inside a request handler would silently corrupt shared state for every subsequent request/connection using that provider until the next restart — there is no runtime guard against this class of bug today"
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "Adding a provider requires editing registry/index.js's generated import list (via the migration scripts named in CLAUDE.md) and restarting the process — there is no hot-reload or admin-API path to register a provider without a restart"
  evidence:
    - { file: open-sse/providers/index.js, line: 30, note: "export const PROVIDERS = {} — mutable plain object, no Object.freeze" }
    - { file: open-sse/executors/default.js, line: 67, note: "PROVIDERS[provider] read (never written) to construct a DefaultExecutor" }
    - { file: open-sse/config/providers.js, line: 3, note: "PROVIDERS/PROVIDER_OAUTH re-exported read-only from providers/index.js" }
  newModule: catalog
  parityStatus: traced
  labels: [REFERENCE_BEHAVIOR]

