- id: catalog.multi-format-variants
  group: Providers
  feature: Provider catalog
  subFeature: A provider exposing more than one wire format for the same account (transport.transports[])
  trigger: A chat request whose detected sourceFormat matches one of a provider's declared alternate transports
  input: "sourceFormat (openai/claude/gemini/...) detected from the inbound client request shape"
  output: "credentials.runtimeTransport set to the matching transports[] entry; buildUrl/buildHeaders in DefaultExecutor prefer it over the provider's default transport"
  businessRules:
    - "A provider like deepseek declares a default transport (openai-format chat/completions) plus a transports[] array with one entry per additional native format it also understands (e.g. a claude-format /anthropic/v1/messages endpoint on the same account) — this exists specifically to let a client whose native format already matches skip the lossy double-hop through the OpenAI pivot (see open-sse/AGENTS.md's direct-route guidance)"
    - "resolveTransport(provider, sourceFormat) in services/provider.js picks the transports[] entry whose format matches; chatCore.js only uses it when the model's modelSupportedFormats also includes that sourceFormat, otherwise it falls back to translation through the default transport"
    - "Once selected, runtimeTransport's own baseUrl/headers/auth completely replace the provider's default transport fields for that request (DefaultExecutor.buildUrl/buildHeaders check credentials.runtimeTransport first) — the two formats are not merged"
  state:
    reads: ["PROVIDERS[id].transports (built once from the registry)", "model's modelSupportedFormats"]
    writes: []
    runtimeOnly: ["credentials.runtimeTransport — set per-request, not persisted"]
  dependencies: ["catalog.registry-build"]
  providerInteraction: "Same upstream account, alternate native-format endpoint (e.g. DeepSeek's /anthropic/v1/messages) instead of the default endpoint"
  fallback: { hasFallback: true, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: []
  persistence: []
  performanceConcerns:
    - "Bypassing the OpenAI-pivot translation for a matched format avoids the lossy double-hop, but each transports[] entry needs its own auth descriptor declared explicitly (it does not inherit the parent transport.auth) — a provider that adds a new format variant without also declaring auth for it would fall through to resolveAuthDescriptor's generic BEARER default"
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "A provider can declare different auth schemes per format variant (deepseek: Authorization Bearer for its openai-format endpoint, x-api-key raw for its claude-format endpoint) even though both endpoints authenticate the same underlying account with the same stored credential value"
