    - { file: open-sse/providers/registry/deepseek.js, line: 34, note: "openai-format variant: Authorization Bearer" }
    - { file: open-sse/providers/registry/deepseek.js, line: 40, note: "claude-format variant: x-api-key raw, same account" }
