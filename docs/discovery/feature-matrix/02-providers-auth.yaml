- id: catalog.registry-build
  group: Providers
  feature: Provider catalog
  subFeature: Build PROVIDERS / PROVIDER_OAUTH / PROVIDER_MEDIA from the per-provider registry at module load
  trigger: First import of open-sse/providers/index.js (or any module re-exporting it) in a process
  input: "REGISTRY — the auto-generated static-import array of all registry/{id}.js default exports"
  output: "Three module-level objects keyed by provider id: PROVIDERS (transport config), PROVIDER_OAUTH (oauth config), PROVIDER_MEDIA (non-chat service config), plus PROVIDER_MODELS"
  businessRules:
    - "A single top-level for-loop over REGISTRY populates all four exported objects in one pass; buildTransport(entry.transport, entry.oauth) re-applies the shared default format:\"openai\" when a provider doesn't declare one, then injects OAUTH_INJECT_FIELDS (clientId, clientSecret, tokenUrl) from entry.oauth into the transport object only for fields the provider's own transport left undefined"
    - "entry.transports (plural — a per-client-format array of endpoint overrides, e.g. deepseek/glm/minimax/kimi exposing both an openai-shaped and a claude-shaped endpoint for the same account) is copied onto PROVIDERS[id].transports verbatim, untouched by buildTransport"
    - "PROVIDER_MEDIA[id] is assembled from two overlapping sources for the same entry: any of the flat MEDIA_KEYS (serviceKinds, ttsConfig, sttConfig, embeddingConfig, imageConfig, imageToTextConfig, videoConfig, musicConfig, searchViaChat, searchConfig, fetchConfig, modelsFetcher, mediaPriority, hiddenKinds) declared at the entry's top level, then entry.media (a legacy nested object) is spread over the top of that — so a top-level field and the same key inside entry.media can both exist, and entry.media wins"
    - "PROVIDER_OAUTH[id] is only ever set when entry.oauth is truthy — a provider with no oauth block (e.g. gemini, which is authModes:[\"apikey\"] only) simply has no key in PROVIDER_OAUTH at all, not an empty object"
  state:
    reads: ["REGISTRY (open-sse/providers/registry/index.js, static import list)"]
    writes: []
    runtimeOnly: ["PROVIDERS, PROVIDER_MODELS, PROVIDER_OAUTH, PROVIDER_MEDIA module-level objects — built once per process, held in memory for the process lifetime"]
  dependencies: []
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: []
  persistence: []
  performanceConcerns:
    - "The loop runs once at module evaluation (Next.js may re-evaluate the module more than once per process for different route bundles, per CLAUDE.md's usageRepo global note, but each re-evaluation just rebuilds the same objects from the same static REGISTRY — not a per-request cost)"
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "REGISTRY_TEMPLATE.js documents the field contract but is deliberately NOT imported by registry/index.js (its own header comment says so) — copying it into registry/{id}.js is the documented way to add a provider; the template itself contributes zero entries"
    - "registry/index.js hides 3 registered-but-disabled providers (trae, devin-cli, windsurf) by commenting out both their import line and their array slot with an inline reason (e.g. \"devin-cli — hidden, spawns local agent with shell/fs access\"); their registry/{id}.js files still exist on disk and still contain full transport/oauth blocks, they are simply excluded from REGISTRY at build time"
  evidence:
    - { file: open-sse/providers/index.js, line: 9, note: "OAUTH_INJECT_FIELDS = [clientId, clientSecret, tokenUrl]" }
    - { file: open-sse/providers/index.js, line: 12, note: "buildTransport — re-apply format default, inject oauth-canonical fields" }
    - { file: open-sse/providers/index.js, line: 34, note: "for (const entry of REGISTRY) — the single build pass" }
    - { file: open-sse/providers/index.js, line: 37, note: "entry.transports copied verbatim onto PROVIDERS[id].transports" }
    - { file: open-sse/providers/index.js, line: 40, note: "PROVIDER_OAUTH[entry.id] = entry.oauth — only set when entry.oauth is truthy" }
    - { file: open-sse/providers/index.js, line: 42, note: "mediaFields built from MEDIA_KEYS then entry.media spread over it (legacy wins)" }
    - { file: open-sse/providers/registry/index.js, line: 105, note: "// import p102 from \"./trae.js\" — commented import for a hidden provider" }
    - { file: open-sse/providers/registry/index.js, line: 229, note: "// p102, // trae — hidden, no tool calling — commented array slot with reason" }
