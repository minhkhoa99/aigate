    - { code: MODEL_UNAVAILABLE, when: "404 — 2 min lock, next account", partial: false }
    - { code: RATE_LIMIT, when: "429 or rate-limit text — exponential lock, next account", partial: false }
    - { code: PROVIDER_UNAVAILABLE, when: "5xx / network — after in-place retries, 30 s lock, next account", partial: false }
