- id: fallback.executor-retry-budget
  group: Auto fallback
  feature: Auto fallback
  subFeature: In-place retry (tryRetry) and computeRetryDelay, and the end-to-end retry ceiling
  trigger: A response status or network error for which retryConfig[status] has attempts > 0
  input: "HTTP status (network errors use key 502), DEFAULT_RETRY_CONFIG merged with the provider's transport.retry"
  output: "Same URL retried after a delay, or the response handed back to the caller"
  businessRules:
    - "DEFAULT_RETRY_CONFIG: 429 {0 attempts}, 502 {3, 3000 ms}, 503 {3, 2000 ms}, 504 {2, 3000 ms}; every other status 0. A numeric entry means attempts with the legacy 2000 ms delay"
    - "Provider overrides: antigravity 429/500/503 x3; grok-cli 429 x2 @2000, 502/503 x2 @1500; vercel-ai-gateway 429 x2 @2000; kiro 429 x0"
    - "The attempt counter is per URL and shared across status codes: attempts for the CURRENT status are compared against the combined count, so one URL gets at most max(attempts) retries in total"
    - "Delay is fixed per status (no exponential backoff, no jitter) unless the executor defines computeRetryDelay — only antigravity does"
    - "Antigravity computeRetryDelay: Retry-After header, then retry hints in the error body; a hint <= 10 s is used, > 10 s vetoes the retry (return false -> fallback); no hint -> non-transient status/message vetoes; transient -> min(1000 * 2^attempt, cap) with cap 10 s for 429 and 15 s otherwise. So computeRetryDelay IS bounded: at most 15 s per wait"
    - "Retries happen before any status classification — they are purely status-code driven; no idempotency or body inspection in the base executor"
  state:
    reads: ["DEFAULT_RETRY_CONFIG", "PROVIDERS[provider].retry"]
    writes: []
    runtimeOnly: ["retryAttemptsByUrl"]
  dependencies: []
  providerInteraction: "Repeated POSTs of the same body to the same URL"
  fallback: { hasFallback: true, retry: "Status-keyed fixed-delay retries (502 x3 @3s, 503 x3 @2s, 504 x2 @3s by default); antigravity exponential capped at 10/15 s", timeout: "Each attempt has its own 60 s connect timeout", quota: null }
  errorCases:
    - { code: PROVIDER_UNAVAILABLE, when: "502/503/504 or network error — retried in place up to the configured attempts", partial: false }
    - { code: RATE_LIMIT, when: "429 — no in-place retry by default; antigravity/grok-cli/vercel-ai-gateway retry", partial: false }
  sideEffects: []
  persistence: []
  performanceConcerns:
    - "Q3 per-URL ceiling (default config): 4 attempts x 60 s connect timeout + 3 x 3 s delays = 249 s before the executor gives up on one URL when the upstream never answers"
    - "There is NO overall request deadline. Worst case multiplies: per-URL ceiling x baseUrls (kiro 3) x 2 (the 401/403 path re-executes once with the full budget, plus refreshWithRetry's 3 attempts with 1 s + 2 s sleeps) x number of active accounts for the provider x number of combo members"
    - "A retried response is discarded without response.body.cancel(), leaving the upstream socket open until garbage collection"
    - "The retry sleep is a bare setTimeout, not tied to the abort signal — a cancelled request still waits out the delay before the next fetch fails fast on the aborted signal"
