    reads: []
    writes: []
    runtimeOnly: []
  dependencies: ["tokensaver.rtk-compress-shapes"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: []
  persistence: []
  performanceConcerns: []
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "If RTK compressed an error trace and a filter (e.g. dedup-log) removed the one line carrying the actual exception, the model would retry blind or hallucinate a cause — this is the concrete failure the skip prevents"
