- id: tokensaver.savings-recording
  group: Token Saver
  feature: Token Saver
  subFeature: "Only PXPIPE's savings are persisted; RTK and headroom stats are console-log only and discarded"
  trigger: "End of each stage's run, per request"
  input: "Each stage's own stats object (rtkStats, headroomStats/headroomDiagnostics, pxpipeSummary)"
  output: "PXPIPE: one JSON line appended to DATA_DIR/pxpipe/events.jsonl (rotated at 5MB) via onPxpipeEvent -> appendPxpipeEvent, later aggregated by getPxpipeStats() for the dashboard. RTK/headroom/caveman/ponytail: formatted into a console.log/log.line string and never written anywhere else"
  businessRules:
    - "chatCore.js never returns rtkStats/headroomStats to its caller (chat.js) and chat.js does not persist them either — grepping the whole tree for rtkStats/headroomStats/rtkLine/headroomLine shows no reference outside chatCore.js's own log lines"
    - "pxpipeSummary is the one exception: chat.js wires onPxpipeEvent: appendPxpipeEvent, and chatCore.js calls onPxpipeEvent?.({provider, model, ...pxpipeSummary}) after every pxpipe attempt (applied or not), inside its own try/catch so a broken stats write can't fail the request"
    - "getPxpipeStats() buckets events into all/today/yesterday/last7d/last30d totals plus a daily timeline, classifying non-applied events as either 'errors' (transform_error/timeout) or 'bypassed' (everything else, e.g. below_threshold/unsupported_format)"
  state:
    reads: []
    writes: ["DATA_DIR/pxpipe/events.jsonl"]
    runtimeOnly: []
  dependencies: ["tokensaver.pxpipe-compress"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: ["fs.appendFile to events.jsonl, fire-and-forget (no awaited callback)"]
  persistence: ["events.jsonl (pxpipe only) — file-rotation at 5MB to events.jsonl.1, no DB table"]
  performanceConcerns:
    - "events.jsonl grows unbounded between rotations and readPxpipeEvents() reads the whole file into memory on every stats/logs request — fine at hobby scale, a real bottleneck under sustained high request volume"
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "A corrupt line in events.jsonl is skipped silently (try/catch per line in readPxpipeEvents) rather than aborting the whole read"
  evidence:
