- id: tokensaver.pxpipe-management-routes
  group: Token Saver
  feature: Token Saver
  subFeature: "8 api/pxpipe/* routes: install, lifecycle, and observability for the in-process PXPIPE module"
  trigger: "Dashboard Token Saver card actions and status polling"
  input: "None (GET) or {extras} style bodies where noted; all are simple POST/GET, no auth beyond the dashboard session"
  output: "JSON status/result payloads; errors returned as {error, code} with 500 (or 400/409 for expected preconditions), never thrown to the Next.js error boundary"
  businessRules:
    - "install: npm-installs pxpipe-proxy@latest into DATA_DIR/pxpipe (serialized — concurrent calls await the same in-flight promise), unloads any cached module, then re-runs the health check"
    - "start: auto-installs first only if settings.pxpipeAutoInstall is true and the package is missing, otherwise 409 NOT_INSTALLED; then loads the module"
    - "stop: drops the cached module reference only — requests fail open to uncompressed passthrough (compressWithPxpipe sees transform is not a function) until started again"
    - "restart: unload then load, for picking up an upgraded install without a full server restart"
    - "health: installed? -> module loads? -> a synthetic ping request transforms? three-step checklist, each step short-circuiting the next on failure"
    - "logs / stats: read-only; logs tails install.log plus the events.jsonl audit trail, stats aggregates it into all-time/today/7d/30d windows and a daily timeline"
  state:
    reads: ["settings.pxpipeAutoInstall (start only)", "settings.pxpipeEnabled/minChars/timeoutMs (status only)"]
    writes: ["DATA_DIR/pxpipe/node_modules/pxpipe-proxy (install)", "DATA_DIR/pxpipe/install.log"]
    runtimeOnly: ["the module cache from tokensaver.pxpipe-library-mode-status"]
  dependencies: ["tokensaver.pxpipe-library-mode-status"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: "install: 5-minute hard kill (INSTALL_TIMEOUT_MS) via SIGKILL on the npm child process", quota: null }
  errorCases:
    - { code: INTERNAL_ERROR, when: "npm not found on PATH during install", partial: false }
    - { code: INTERNAL_ERROR, when: "npm install exits non-zero or times out after 5 minutes", partial: false }
    - { code: INVALID_REQUEST, when: "start called while not installed and pxpipeAutoInstall is off", partial: false }
  sideEffects: ["fire-and-forget event log line per compression attempt (see tokensaver.savings-recording)"]
  persistence: ["install.log tail, events.jsonl (via events.js)"]
  performanceConcerns:
    - "install has maxDuration: 300 (Next route config) matching the 5-minute npm timeout"
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "getInstallInfo() treats 'installed' as purely a filesystem check (package.json + library.js both exist) — it does not verify the package is loadable or version-compatible; that's what health's second step is for"
  evidence:
