    - { file: open-sse/translator/response/claude-to-openai.js, line: 116, note: "content_block_stop THINKING: bare '</think>' marker pushed into content" }
    - { file: open-sse/translator/concerns/reasoning.js, line: 7, note: "reasoningDelta(text) (withRole defaults false, the call shape used here) returns { reasoning_content: text } — a separate structured field" }
    - { file: open-sse/translator/concerns/chunk.js, line: 9, note: "buildChunk passes the delta object through verbatim as choices[0].delta" }
    - { file: open-sse/translator/request/openai-to-claude.js, line: 255, note: "getContentBlocksFromMessage(ASSISTANT) reads msg.content/msg.tool_calls only — never msg.reasoning_content" }
    - { file: open-sse/translator/request/openai-to-claude.js, line: 224, note: "is_error preserved only on an already-Claude-shaped embedded tool_result block" }
