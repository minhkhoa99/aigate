  dependencies: ["routing.forced-stream-json-collapse"]
  providerInteraction: "POST https://copilot.tencent.com/v2/chat/completions or https://www.codebuddy.ai/v2/chat/completions"
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases:
    - { code: INVALID_REQUEST, when: "the gateway content filter refuses the request", partial: false }
  sideEffects: []
  persistence: []
  performanceConcerns: []
  behavior: { streaming: true, cancellation: null, concurrency: null }
