    - { file: open-sse/translator/response/kiro-to-claude.js, line: 4, note: "docblock: chunks arriving here are already OpenAI-shaped (from KiroExecutor), not raw EventStream" }
    - { file: open-sse/translator/response/kiro-to-claude.js, line: 49, note: "kiroToClaudeResponse(chunk, state) — re-implements openai-to-claude.js mapping" }
    - { file: open-sse/translator/index.js, line: 87, note: "directFn = requestRegistry.get(`${sourceFormat}:${targetFormat}`) — the lookup that reaches claudeToKiroRequest" }
