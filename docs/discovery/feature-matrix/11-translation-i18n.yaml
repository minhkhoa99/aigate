    - { file: open-sse/executors/codebuddy-cn.js, line: 55, note: "none/off removed, else reasoning_summary auto" }
    - { file: open-sse/executors/codebuddy-intl.js, line: 18, note: "intl: stream forced, reasoning rule at 21, no prompt rewrite" }
