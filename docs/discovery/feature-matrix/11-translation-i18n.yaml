#
# Two distinct subjects, per the brief:
#   translator.*  — the format-translation engine (open-sse/translator/**, open-sse/transformer/**,
#                    src/app/api/translator/**). newModule: routing.
#   i18n.*        — the UI language system (src/i18n/**, src/app/api/locale). newModule: tooling.
#
# Prior entries already documented the request-side pivot mechanics in
# 05-request-routing-fallback.yaml (routing.source-format-detection,
