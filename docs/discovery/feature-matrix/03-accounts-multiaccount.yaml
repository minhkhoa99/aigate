- id: account.select-round-robin-sticky
  group: Multi-account
  feature: Multi-account selection
  subFeature: Round-robin strategy with sticky-session limit, and what clears stickiness
  trigger: getProviderCredentials() reaches strategy selection, no preferredConnectionId match, and the effective fallbackStrategy is \"round-robin\"
  input: "availableConnections; providerOverride.stickyRoundRobinLimit or settings.stickyRoundRobinLimit (default 3)"
  output: "Either the same connection as last time (sticky continuation) or the least-recently-used available connection (rotation), with lastUsedAt/consecutiveUseCount updated in the DB before returning"
  businessRules:
    - "availableConnections is sorted by lastUsedAt descending to find the 'current' candidate — the most recently used connection is the sticky candidate, not an explicit session id"
    - "Sticky continuation condition: current exists AND current.lastUsedAt is set AND current.consecutiveUseCount < stickyLimit — while true, the same connection keeps being returned and consecutiveUseCount increments by 1 each call"
    - "Stickiness clears in exactly one way: once consecutiveUseCount reaches stickyLimit, the else branch runs instead — it re-sorts availableConnections by lastUsedAt ascending (oldest/never-used first, using priority as a tiebreak for two never-used connections) and picks that one, resetting consecutiveUseCount to 1 for the new connection. A never-used connection (no lastUsedAt) is also picked over any used one, since !a.lastUsedAt sorts it first in the ascending sort"
    - "Locking a connection out of availableConnections (model lock or exclude-set) also implicitly breaks stickiness: if the current sticky connection becomes unavailable, it is filtered out upstream and round-robin's 'current' becomes whichever remaining connection has the most recent lastUsedAt"
    - "Both the stick-with-current and the rotate-to-oldest branches await updateProviderConnection() before returning, so the DB write for bookkeeping happens synchronously with selection, not fire-and-forget"
  state:
    reads: ["providerConnections table (isActive=true, filtered by model lock)", "settings.stickyRoundRobinLimit", "settings.providerStrategies"]
    writes: ["providerConnections.lastUsedAt", "providerConnections.consecutiveUseCount"]
    runtimeOnly: []
  dependencies: ["settings.defaults-and-merge", "catalog.connection-listing"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: []
  persistence: ["providerConnections.lastUsedAt", "providerConnections.consecutiveUseCount"]
  performanceConcerns: []
  behavior: { streaming: false, cancellation: null, concurrency: "Two concurrent round-robin calls for the same provider both read availableConnections before either writes lastUsedAt back — both can independently decide the same connection is the sticky 'current' (or the same oldest connection is next), producing an unintended double-assignment; the global selectionMutex (account.select-mutex-global-scope) is the only thing preventing this today, by fully serializing the read+write per call" }
  edgeCases:
    - "priority is only consulted as a tiebreaker for two connections that both have no lastUsedAt (brand new accounts) — once any account has been used once, priority stops influencing round-robin order entirely"
  evidence:
    - { file: src/sse/services/auth.js, line: 151, note: "round-robin branch entry, stickyLimit resolution" }
    - { file: src/sse/services/auth.js, line: 155, note: "byRecency sort — most-recently-used first" }
    - { file: src/sse/services/auth.js, line: 165, note: "sticky condition: current.lastUsedAt && currentCount < stickyLimit" }
    - { file: src/sse/services/auth.js, line: 169, note: "updateProviderConnection — increment consecutiveUseCount, keep same connection" }
    - { file: src/sse/services/auth.js, line: 175, note: "sortedByOldest — ascending lastUsedAt, priority tiebreak only for two unused connections" }
    - { file: src/sse/services/auth.js, line: 185, note: "updateProviderConnection — consecutiveUseCount reset to 1 for the rotated-to connection" }
  newModule: connections
  parityStatus: traced
  labels: [REFERENCE_BEHAVIOR]

