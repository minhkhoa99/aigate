- id: account.mark-unavailable-lock-reasons
  group: Provider account management
  feature: Provider account management
  subFeature: Every distinct reason markAccountUnavailable() locks an account+model pair, and that reason's expiry rule
  trigger: A provider request for a given connection+model fails; the caller (e.g. src/sse/handlers/chat.js) calls markAccountUnavailable(connectionId, status, errorText, provider, model, resetsAtMs)
  input: "connectionId, HTTP status, error text/body, provider id, model, optional resetsAtMs (provider-reported exact reset time in ms epoch)"
  output: "{ shouldFallback, cooldownMs } — and, when shouldFallback, a modelLock_${model} (or modelLock___all) field written on the connection row with an ISO expiry"
  businessRules:
    - "Precedence when multiple rules could apply: the GitHub monthly case is checked first (via githubMonthlyResetMs), then a caller-supplied future resetsAtMs, then the generic text/status rule table (checkFallbackError) — the first match wins and the others are not evaluated"
    - "GitHub monthly usage limit: provider resolves to \"github\", status is exactly 402, and errorText contains \"you've reached your additional usage limit for your plan\" (case-insensitive) — locks the ACCOUNT-WIDE modelLock___all key (model is forced to null via `githubResetAtMs ? null : model`) until 00:00 UTC on the 1st of the following month, computed with Date.UTC(year, month+1, 1); backoffLevel is reset to 0"
    - "Provider-supplied exact reset (non-Antigravity, e.g. codex usage_limit_reached): resetsAtMs is in the future — cooldownMs = resetsAtMs - now, but capped at MAX_RATE_LIMIT_COOLDOWN_MS (30 minutes) even if the provider reports a reset many hours away; backoffLevel resets to 0"
    - "Provider-supplied exact reset, Antigravity: same resetsAtMs path, but the 30-minute cap is explicitly skipped for provider === \"antigravity\" — the exact resetAt from Google's quota API is honored uncapped, however far in the future"
    - "Backoff-rate-limit reasons (checkFallbackError, ERROR_RULES text match on \"rate limit\"/\"too many requests\"/\"quota exceeded\"/\"capacity\"/\"overloaded\", or HTTP 429): exponential cooldown = min(2000 * 2^(min(backoffLevel+1,15)-1), 300000) ms — i.e. 2s, 4s, 8s... capped at 5 minutes at level 15; backoffLevel is persisted and incremented on each hit"
    - "Fixed 2-minute cooldown reasons: text \"no credentials\" or \"improperly formed request\", or HTTP status 401/402/403/404 — cooldownMs = 120000 flat, backoffLevel unchanged by this rule (no increment field returned, so the existing level carries over on the connection row)"
    - "Fixed 5-second cooldown: text \"request not allowed\" — cooldownMs = 5000"
    - "Default/unmatched: any error not matched by an ERROR_RULES entry gets TRANSIENT_COOLDOWN_MS (30 seconds)"
    - "Every one of the above locks a model-scoped key modelLock_${model} — never a whole-account flag — except the GitHub monthly case, which is the one reason that explicitly forces the account-wide modelLock___all key regardless of which model triggered it"
  state:
    reads: ["providerConnections table (row by connectionId, for its current backoffLevel)"]
    writes: ["providerConnections.modelLock_${model} or .modelLock___all", "providerConnections.testStatus", "providerConnections.lastError", "providerConnections.errorCode", "providerConnections.lastErrorAt", "providerConnections.backoffLevel"]
    runtimeOnly: []
  dependencies: []
  providerInteraction: null
  fallback: { hasFallback: true, retry: "Exponential backoff for rate-limit-class errors, 2s base doubling to a 5 min cap over 15 levels", timeout: null, quota: "GitHub: locked until 1st of next UTC month. Antigravity: exact provider resetAt, uncapped. Other providers with resetsAtMs: capped at 30 minutes" }
  errorCases:
    - { code: RATE_LIMIT, when: "text matches rate limit/too many requests/quota exceeded/capacity/overloaded, or status is 429 — exponential backoff", partial: false }
    - { code: AUTH_ERROR, when: "status is 401 or 403, or text contains \"no credentials\" — fixed 2 minute cooldown", partial: false }
    - { code: QUOTA_EXHAUSTED, when: "status is 402 (payment required) and NOT the GitHub-monthly text match — fixed 2 minute cooldown", partial: false }
    - { code: MODEL_UNAVAILABLE, when: "status is 404 — fixed 2 minute cooldown", partial: false }
    - { code: INVALID_REQUEST, when: "text contains \"improperly formed request\" — fixed 2 minute cooldown", partial: false }
    - { code: PROVIDER_UNAVAILABLE, when: "text contains \"request not allowed\" — fixed 5 second cooldown", partial: false }
    - { code: PROVIDER_UNAVAILABLE, when: "no ERROR_RULES entry matches — default 30 second transient cooldown", partial: false }
    - { code: QUOTA_EXHAUSTED, when: "caller supplies a future resetsAtMs for a non-Antigravity provider (e.g. codex usage_limit_reached) — cooldown = resetsAtMs - now, capped at 30 minutes", partial: false }
    - { code: QUOTA_EXHAUSTED, when: "caller supplies a future resetsAtMs for Antigravity — cooldown = resetsAtMs - now, uncapped exact reset", partial: false }
    - { code: QUOTA_EXHAUSTED, when: "GitHub 402 with the additional-usage-limit-for-your-plan message — locked account-wide until the 1st of next UTC month", partial: false }
  sideEffects: ["console.error(\"❌ provider [status]: reason\") on every successful lock, independent of the log.warn call"]
  persistence: ["providerConnections row: modelLock_* key(s), testStatus, lastError, errorCode, lastErrorAt, backoffLevel"]
  performanceConcerns: []
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "reason (the stored lastError text) is errorText.slice(0, 100) — a long provider error body is silently truncated in the persisted lastError field, though the full text is still what drove the ERROR_RULES match beforehand"
    - "connectionId === \"noauth\" is an explicit no-op guard at the top — the virtual Public connection (account.select-noauth-virtual-connection) can never be locked"
  evidence:
    - { file: src/sse/services/auth.js, line: 14, note: "githubMonthlyResetMs — provider===github, status===402, text match, Date.UTC(year, month+1, 1)" }
    - { file: src/sse/services/auth.js, line: 239, note: "markAccountUnavailable signature; noauth guard" }
    - { file: src/sse/services/auth.js, line: 246, note: "githubResetAtMs computed first" }
    - { file: src/sse/services/auth.js, line: 254, note: "resetsAtMs branch — antigravity uncapped vs MAX_RATE_LIMIT_COOLDOWN_MS cap for others" }
    - { file: src/sse/services/auth.js, line: 262, note: "else branch — checkFallbackError(status, errorText, backoffLevel) for the generic rule table" }
    - { file: src/sse/services/auth.js, line: 267, note: "buildModelLockUpdate(githubResetAtMs ? null : model, cooldownMs) — GitHub forces the account-wide key" }
