- id: account.select-mutex-global-scope
  group: Multi-account
  feature: Multi-account selection
  subFeature: Mutex scope around getProviderCredentials
  trigger: Every call to getProviderCredentials() — one call per account-selection attempt on any /v1 lane, for any provider
  input: "provider, excludeConnectionIds, model, options.preferredConnectionId"
  output: A selected credentials object, an allRateLimited descriptor, or null — see the other account.select-* entries
  businessRules:
    - "selectionMutex is a single module-scope `let`, not keyed by provider or connection — every call to getProviderCredentials, for every provider, awaits the same chained Promise before doing anything else, and the whole function body (DB reads, settings read, and for round-robin the updateProviderConnection write) runs inside the held mutex"
    - "The actual invariant that needs protecting is per-provider: round-robin's 'pick least-recently-used' read-then-write (lines 154-189) races if two concurrent picks for the SAME provider both read stale lastUsedAt before either writes it back, potentially double-assigning the same account. A per-connection or per-provider mutex would close that race; a single global mutex additionally serializes selection across every unrelated provider in the process"
  state:
    reads: []
    writes: []
    runtimeOnly: ["selectionMutex (module-scope Promise chain)"]
  dependencies: []
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: []
  persistence: []
  performanceConcerns:
    - "Head-of-line blocking: a slow settings/DB read or a round-robin write while selecting an account for provider A stalls the selection step for a concurrent request to completely unrelated provider B, because both wait on the same selectionMutex chain — under load with many providers in flight this serializes a step that only needs per-provider isolation"
  behavior: { streaming: false, cancellation: null, concurrency: "Global mutex serializes ALL getProviderCredentials calls process-wide, regardless of provider" }
  edgeCases: []
  evidence:
    - { file: src/sse/services/auth.js, line: 10, note: "let selectionMutex = Promise.resolve() — single module-scope chain, not per-provider or per-connection" }
    - { file: src/sse/services/auth.js, line: 34, note: "currentMutex = selectionMutex; selectionMutex reassigned to a new pending Promise before any real work starts" }
    - { file: src/sse/services/auth.js, line: 40, note: "await currentMutex — every call queues behind the previous one, whatever provider it was for" }
    - { file: src/sse/services/auth.js, line: 224, note: "finally { resolveMutex() } — mutex held for the full function body, including the round-robin DB write" }
