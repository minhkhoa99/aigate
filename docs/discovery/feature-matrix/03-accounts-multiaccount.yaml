    runtimeOnly: []
  dependencies: []
  providerInteraction: null
  fallback: { hasFallback: true, retry: null, timeout: null, quota: "retryAfter/retryAfterHuman surfaced to the caller so it can return a 503 with a human-readable cooldown" }
