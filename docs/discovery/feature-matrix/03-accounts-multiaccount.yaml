- id: account.concurrent-refresh-race
  group: Multi-account
  feature: Multi-account selection
  subFeature: Whether two concurrent requests against the same connection can both trigger a token refresh
  trigger: Two client requests routed to the same provider+model close enough together that both select the same connection (most likely under fill-first, the default strategy) while its token is expired or the upstream returns 401/403
  input: Two independent in-memory credentials snapshots for the same connectionId, each captured by a separate call to getProviderCredentials/checkAndRefreshToken
  output: "Both requests independently call the provider's refresh endpoint with their own copy of refreshToken; for providers whose refresh token is single-use and rotates on every call, the second call's refresh fails"
  businessRules:
    - "There is no per-connection refresh lock anywhere in this path: getProviderCredentials()'s selectionMutex only wraps the SELECTION step and releases before the caller even starts using the credentials (see account.select-mutex-global-scope) — nothing serializes the subsequent refresh-and-retry, at either the proactive layer (checkAndRefreshToken, called unconditionally after every selection in src/sse/handlers/chat.js line 253) or the reactive layer (chatCore.js's 401/403 handler, line 402)"
    - "Fill-first (the default strategy) always returns the same top-priority connection to every concurrent caller as long as it's available — it does not mark a connection 'checked out', so two requests arriving within the same tens-of-milliseconds window before either has refreshed routinely receive identical credentials.refreshToken values"
    - "Each caller mutates only its own local `credentials` object across refreshWithRetry's internal retry attempts (chatCore.js lines 404-413, explicitly commented as fixing rotation WITHIN one call's own retries) — this local mutation does nothing for a second, separate concurrent request, which still holds the pre-refresh refreshToken value it captured at selection time"
    - "The DB write itself (updateProviderCredentials -> connectionsRepo.updateProviderConnection) is atomic per call (read-merge-write inside one db.transaction), so the stored row is never corrupted — the race is entirely about which in-memory refreshToken each concurrent request's refresh call sends upstream, not about a corrupted database write"
  state:
    reads: []
    writes: []
    runtimeOnly: []
  dependencies: ["auth.refresh-generic-grant", "auth.refresh-provider-specific", "account.select-fill-first-default"]
  providerInteraction: "Each concurrent request independently POSTs to the provider's OAuth refresh endpoint with its own in-memory refreshToken snapshot"
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases:
    - { code: AUTH_ERROR, when: "a provider with single-use rotating refresh tokens (the code names xAI/grok-cli explicitly) receives a second concurrent refresh call using a refreshToken already consumed by the first — the provider returns invalid_grant and refreshWithRetry's 3 attempts all fail on the stale token", partial: false }
  sideEffects: []
  persistence: []
  performanceConcerns: []
  behavior: { streaming: false, cancellation: null, concurrency: "No cross-request lock guards token refresh for a given connection; only refresh attempts WITHIN a single request's own refreshWithRetry loop see each other's rotated token" }
  edgeCases:
    - "This is most likely to surface as a burst failure right at token-expiry time: many concurrent requests for a busy provider/model all pass isTokenExpiringSoon() at once, all trigger checkAndRefreshToken proactively, and for a rotating-refresh-token provider only the first to complete its POST gets a token that survives — the rest fail with invalid_grant and (depending on classifyOAuthRefreshError) may mark the connection unavailable via markAccountUnavailable even though a different request just successfully refreshed it seconds earlier"
  evidence:
    - { file: src/sse/services/auth.js, line: 10, note: "selectionMutex releases (finally block) before caller code runs — mutex does not extend into the refresh/retry phase" }
    - { file: src/sse/handlers/chat.js, line: 253, note: "checkAndRefreshToken called unconditionally on every selection, no per-connection gate" }
    - { file: open-sse/handlers/chatCore.js, line: 402, note: "401/403 handler calls executor.refreshCredentials(credentials, log) independently per request" }
    - { file: open-sse/handlers/chatCore.js, line: 404, note: "comment explicitly scoping the rotation fix to 'refreshWithRetry's 2nd/3rd attempt' — i.e. within one call, not across requests" }
    - { file: src/sse/services/tokenRefresh.js, line: 233, note: "checkAndRefreshToken proactive path — same no-lock pattern, runs on every request whose token is near expiry" }
    - { file: src/lib/db/repos/connectionsRepo.js, line: 192, note: "updateProviderConnection — the DB write itself is atomic per call, ruling out a corrupted-row race" }
  newModule: connections
  parityStatus: traced
  labels: [SUSPECTED_BUG]
  suspicion:
    expected: "Two concurrent requests hitting an expired/rejected token on the same connection should converge on one valid refreshed token — either serialized so the second reuses the first's fresh token, or each refresh is independently idempotent regardless of which refreshToken value it started from"
    actual: "No per-connection lock exists around either the proactive (checkAndRefreshToken) or reactive (chatCore.js 401/403) refresh call; each concurrent request refreshes using its own in-memory refreshToken snapshot with no coordination with other in-flight requests for the same connection"
    impact: "For providers with single-use rotating refresh tokens (the code names xAI and grok-cli explicitly), a burst of concurrent requests around token-expiry time causes all but the first refresh to fail with invalid_grant, which can further trigger markAccountUnavailable and lock the connection out even though it was just successfully refreshed by a sibling request"

