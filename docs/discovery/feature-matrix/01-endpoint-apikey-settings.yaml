    expected: "Given generateCrc/parseApiKey/verifyApiKeyCrc exist specifically to bind a key to a machineId and detect tampering, the request-time auth path (validateApiKey / isValidApiKey) calls verifyApiKeyCrc (or parseApiKey) to reject a key whose embedded CRC doesn't match its machineId+keyId before or in addition to the DB lookup"
