    reads: ["NODE_ENV", "UPDATER_CONFIG (package name, ports, timeouts)"]
    writes: ["DATA_DIR/runtime/updater/updater.js (copied once)", "DATA_DIR/update/status.json and install.log (written by the detached updater process, outside this route's own execution)"]
    runtimeOnly: []
