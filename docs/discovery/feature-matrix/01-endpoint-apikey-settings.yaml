    - { file: src/app/api/settings/route.js, line: 51, note: "existing-hash branch: bcrypt.compare(currentPassword, currentHash) required" }
    - { file: src/app/api/settings/route.js, line: 62, note: "first-time branch: currentPassword compared against the hardcoded literal '123456'" }
    - { file: src/app/api/auth/login/route.js, line: 58, note: "the equivalent login-time check correctly reads process.env.INITIAL_PASSWORD before falling back to '123456'" }
  newModule: settings
  parityStatus: traced
  labels: [SUSPECTED_BUG]
  suspicion:
    expected: "The first-time password-change gate in PATCH /api/settings checks currentPassword against the operator's actual configured initial password, i.e. `process.env.INITIAL_PASSWORD || \"123456\"`, mirroring the check already implemented in src/app/api/auth/login/route.js line 58 for the same purpose"
    actual: "settings/route.js line 62 compares currentPassword only against the hardcoded literal \"123456\", never consulting process.env.INITIAL_PASSWORD"
    impact: "An operator who sets INITIAL_PASSWORD to a non-default value (as CLAUDE.md instructs: 'must override') cannot use that real initial password to complete their first password change through the dashboard/API — currentPassword !== '123456' is rejected with 401 even though it is the correct, configured initial password. Worse, the well-known literal '123456' still satisfies this specific check regardless of what INITIAL_PASSWORD was set to, so on an install that changed the env var specifically to move off the public default, a local caller who still knows the old default can pass this gate anyway."

