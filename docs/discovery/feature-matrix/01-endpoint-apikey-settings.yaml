    - { file: next.config.mjs, line: 71, note: "/codex/:path* source, rewritten to /api/v1/responses (destination on the next line)" }
    - { file: next.config.mjs, line: 79, note: "/v1beta/:path* source, rewritten to /api/v1beta/:path* (destination on the next line)" }
