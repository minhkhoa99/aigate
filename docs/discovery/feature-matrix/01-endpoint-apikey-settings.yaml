- id: identity.saml-replay-inresponseto-gap
  group: Settings
  feature: Authentication
  subFeature: SAML assertion replay protection is skippable whenever no saml_state cookie is presented
  trigger: POST /api/auth/saml/acs with a SAMLResponse but no (or an already-expired/already-consumed) saml_state cookie
  input: "A previously-valid, correctly-signed SAMLResponse, replayed without the original saml_state cookie"
  output: "The assertion is accepted and a session cookie is issued exactly as if it were a fresh, expected response — the InResponseTo value inside the assertion is never checked in this case"
  businessRules:
    - "createSamlInstance configures node-saml with validateInResponseTo: 'never' — the library's own built-in InResponseTo/replay tracking is explicitly disabled for every request, by explicit choice, not omission"
    - "validateSamlResponse's own manual replay check only runs when expectedRequestId is truthy; expectedRequestId is cookieStore.get('saml_state')?.value || '', so any ACS POST that arrives without a live saml_state cookie (cookie already expired past its 10-minute maxAge, already deleted by an earlier ACS attempt — the route deletes it unconditionally before validation even starts — or simply omitted by a replaying client) skips the InResponseTo comparison entirely"
    - "With both the library-level and the fallback manual check bypassable, validatePostResponseAsync's signature/expiry checks are the only remaining defense — a correctly-signed assertion remains fully valid to replay for its entire IdP-set validity window (NotOnOrAfter), from any client, with no per-assertion one-time-use enforcement anywhere in this code path"
  state:
    reads: ["saml_state cookie (optional — its absence is what triggers the gap)"]
    writes: []
    runtimeOnly: []
  dependencies: ["identity.saml-login-flow"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: []
  persistence: []
  performanceConcerns: []
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "Because acs/route.js deletes the saml_state cookie unconditionally on every attempt (success or failure, before validation runs), a second POST of the exact same SAMLResponse — by the same browser or a copy of the captured form body — always arrives with expectedRequestId === '' and is therefore never subject to any InResponseTo check, not even the disabled library-level one"
  evidence:
    - { file: src/lib/auth/saml.js, line: 101, note: "validateInResponseTo: 'never' — node-saml's own replay check is disabled" }
    - { file: src/lib/auth/saml.js, line: 149, note: "manual InResponseTo check is inside `if (expectedRequestId)` — silently skipped when the cookie is absent" }
    - { file: src/lib/auth/saml.js, line: 159, note: "validatePostResponseAsync — signature/condition checks only; no replay tracking of its own given validateInResponseTo: 'never'" }
    - { file: src/app/api/auth/saml/acs/route.js, line: 30, note: "storedRequestId defaults to '' when the saml_state cookie is missing" }
    - { file: src/app/api/auth/saml/acs/route.js, line: 33, note: "cookieStore.delete('saml_state') runs unconditionally before SAMLResponse is even read" }
  newModule: identity
  parityStatus: traced
  labels: [SUSPECTED_BUG]
  suspicion:
    expected: "A signed SAML assertion should be usable to establish a session at most once: either node-saml's own validateInResponseTo tracking should be enabled ('always' or 'ifPresent'), or the code's manual InResponseTo/expectedRequestId comparison should be mandatory (reject when expectedRequestId is missing) rather than only applied when a saml_state cookie happens to still be present."
    actual: "createSamlInstance sets validateInResponseTo: 'never', and validateSamlResponse's own fallback InResponseTo check is wrapped in `if (expectedRequestId)`, so a request with no saml_state cookie (already consumed, expired, or simply not sent) skips replay validation entirely and is judged solely on signature and time-window validity."
    impact: "Any captured, correctly-signed SAMLResponse (via browser history/cache, a shared proxy log, a compromised extension, or a non-TLS hop) can be POSTed to /api/auth/saml/acs and re-establish a valid dashboard session for that identity at any point before the assertion's IdP-set NotOnOrAfter expiry, with no per-assertion one-time-use enforcement — a classic SAML replay attack that InResponseTo tracking exists specifically to prevent."

