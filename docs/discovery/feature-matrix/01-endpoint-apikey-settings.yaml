- id: identity.machine-id-derivation
  group: Endpoint & API Key
  feature: Machine identity
  subFeature: Derive the stable per-install machineId embedded in new API keys
  trigger: Any call to getConsistentMachineId — from POST /api/keys (key generation) or CLI auth
  input: "Optional salt string; defaults to process.env.MACHINE_ID_SALT or the literal 'endpoint-proxy-salt'"
  output: "16-char lowercase hex string, stable across process restarts"
  businessRules:
    - "Raw machine id is read from a persisted file (DATA_DIR/machine-id) first; only falls back to node-machine-id, then crypto.randomUUID(), if the file is missing or unreadable"
    - "The raw id is written back to disk (mode 0o600) the first time it is computed, so it survives node-machine-id giving inconsistent values across runtimes"
    - "A second secret (DATA_DIR/auth/cli-secret) is mixed in only when the caller passes the special CLI_AUTH_SALT ('9r-cli-auth'), producing a different, unguessable hash for CLI-to-server auth than for API-key machineId embedding"
  state:
    reads: ["DATA_DIR/machine-id file", "DATA_DIR/auth/cli-secret file", "MACHINE_ID_SALT env var"]
    writes: ["DATA_DIR/machine-id file (first run only)", "DATA_DIR/auth/cli-secret file (first run only)"]
    runtimeOnly: ["cachedRawId module-level cache", "cachedCliSecret module-level cache"]
  dependencies: []
  providerInteraction: null
  fallback: { hasFallback: true, retry: null, timeout: null, quota: null }
  errorCases:
    - { code: INTERNAL_ERROR, when: "both the machine-id file and node-machine-id fail (rare)", partial: false }
  sideEffects: ["Writes machine-id and cli-secret files to disk on first run"]
  persistence: ["DATA_DIR/machine-id (plain raw id, not the derived hash)", "DATA_DIR/auth/cli-secret (random 32-byte hex)"]
  performanceConcerns:
    - "First call per process does up to 2 filesystem reads and writes; subsequent calls hit the module-level cache"
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "If node-machine-id and the persisted file are both unavailable, the id falls back to crypto.randomUUID() — a fresh identity every process, silently changing every key's embedded machineId on that host"
  evidence:
    - { file: src/shared/utils/machineId.js, line: 16, note: "loadRawMachineId — file-first, then node-machine-id, then random UUID fallback" }
    - { file: src/shared/utils/machineId.js, line: 35, note: "loadCliSecret — persisted random secret used only for CLI_AUTH_SALT" }
    - { file: src/shared/utils/machineId.js, line: 49, note: "getConsistentMachineId — sha256(raw + salt + extra), truncated to 16 hex chars" }
  newModule: identity
  parityStatus: traced
  labels: [REFERENCE_BEHAVIOR]

