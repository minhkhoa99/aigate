- id: identity.password-login-lockout
  group: Endpoint & API Key
  feature: Dashboard authentication
  subFeature: POST /api/auth/login password check with progressive per-client lockout
  trigger: POST /api/auth/login with { password }
  input: "JSON body { password }, the client's bucket key from getClientIp(), the stored bcrypt hash (or INITIAL_PASSWORD/'123456' when none is stored)"
  output: "200 { success: true } plus the auth_token cookie; 401 with remainingBeforeLock; or 429 with Retry-After while locked"
  businessRules:
    - "A locked bucket is refused with 429 and a Retry-After header before the password is even compared"
    - "Every failed comparison counts against the bucket; the 5th consecutive failure locks it, for 30s, then 2m, 10m, and 30m on each later lock (the last step repeats)"
    - "The failure count resets 1h after the last failure when the bucket is not locked, and immediately on a successful login"
    - "A failed attempt that does not yet lock answers 401 and tells the client how many attempts remain before lockout"
    - "The bucket key is a proxy-stamped real IP only when the custom server proves it set the header, X-Forwarded-For only when TRUST_PROXY=true, and otherwise the single bucket 'unknown', so a client cannot rotate a spoofed header to escape its lockout"
  state:
    reads: ["settings.password (bcrypt hash)", "process.env.INITIAL_PASSWORD", "process.env.TRUST_PROXY"]
    writes: ["auth_token cookie on success"]
    runtimeOnly: ["in-process Map ip -> { fails, lockUntil, lockLevel, lastFailAt }, lost on restart"]
  dependencies: ["identity.session-cookie-lifecycle"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases:
    - { code: AUTH_ERROR, when: "the password does not match (401)", partial: false }
    - { code: RATE_LIMIT, when: "the client's bucket is locked (429 with Retry-After)", partial: false }
  sideEffects: ["Mutates the in-memory lockout map"]
  persistence: []
  performanceConcerns:
    - "The lockout map has no size bound; entries are removed only when the same bucket is read again after its window expires, so many distinct buckets grow it without limit"
  behavior: { streaming: false, cancellation: null, concurrency: "Single-process map; restart clears all lockouts" }
  edgeCases:
    - "Without the custom server or TRUST_PROXY, every client shares the 'unknown' bucket, so one attacker's failures lock out every other client too"
  evidence:
