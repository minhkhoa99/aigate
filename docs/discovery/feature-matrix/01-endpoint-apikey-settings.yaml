    - { file: src/app/api/auth/login/route.js, line: 96, note: "recordFail after a mismatch, then 429 if now locked or 401 with remainingBeforeLock (line 106)" }
    - { file: src/lib/auth/loginLimiter.js, line: 4, note: "MAX_FAILS_BEFORE_LOCK = 5; LOCK_STEPS_MS 30s/2m/10m/30m (line 5); FAIL_WINDOW_MS 1h (line 6)" }
    - { file: src/lib/auth/loginLimiter.js, line: 49, note: "getClientIp: trusted stamped header, TRUST_PROXY XFF, else the single 'unknown' bucket (line 63)" }
