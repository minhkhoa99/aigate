  errorCases: []
  sideEffects: []
  persistence: []
  performanceConcerns:
    - "The 7d/30d/60d/all path loads every usageDaily row in range and every matching usageHistory row (for the lastUsed overlay) on every request; there is no server-side caching beyond the unrelated 5s pricing cache"
