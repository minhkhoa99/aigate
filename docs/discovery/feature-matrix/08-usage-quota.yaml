- id: usage.request-field-trace-order
  group: Usage
  feature: Per-request usage capture
  subFeature: Every field recorded for one request, in the order it becomes known
  trigger: A chat request reaches a success or error return point inside handleChatCore (or the embeddings/other modality equivalents)
  input: "modelInfo {provider, model}, credentials.connectionId, the translated request body, the upstream response body, and wall-clock marks"
  output: "A buildRequestDetail() object persisted via saveRequestDetail, and a canonicalized {provider, model, tokens, connectionId, apiKey, endpoint, cost, status} object persisted via saveRequestUsage"
  businessRules:
    - "provider and model are known first — they come from modelInfo at handler entry, before any network call"
    - "account (connectionId) is known next — it is set on credentials before dispatch and threaded through as connectionId"
    - "input/output/cached tokens are known only after the upstream response returns: extractUsageFromResponse() branches on Claude (usage.input_tokens), OpenAI (usage.prompt_tokens) or Gemini (usageMetadata) response shapes to pull them out"
    - "cached tokens are folded into prompt_tokens by canonicalizeUsage() before storage (the cache-inclusive convention), not stored as a separate additive field"
    - "cost is computed last and lazily: saveUsageStats()/saveRequestUsage() receive raw tokens and provider/model; calculateCost() looks up pricing and multiplies inside saveRequestUsage itself, not by the caller"
    - "latency.total = Date.now() - requestStartTime, computed once the outcome (success or error) is known; latency.ttft is only ever set by the streaming path (buildOnStreamComplete) — every non-streaming and forced-JSON error/success path hardcodes ttft: 0"
    - "status is 'success' (buildRequestDetail default) or explicitly 'error'; the error message is stored under response.error, not as a separate field"
    - "fallback attempts are NOT part of the usage row: a single request may try several accounts/providers before one succeeds, but only the account/provider that finally answered (or the account whose failure ended the loop) is passed into saveRequestUsage/saveRequestDetail — see edgeCases"
  state:
    reads: []
    writes: ["usageHistory / usageDaily (via saveRequestUsage)", "requestDetails (via saveRequestDetail)"]
    runtimeOnly: ["requestStartTime", "pxpipeSummary"]
  dependencies: ["routing.usage-recording-timing"]
  providerInteraction: "Token counts come from the upstream response body (usage / usageMetadata block); when absent they are estimated elsewhere in the streaming path (see routing.usage-recording-timing), never left null"
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: []
  persistence: ["usageHistory row (promptTokens, completionTokens, cost, status, tokens JSON)", "requestDetails row (latency, tokens, request/providerRequest/providerResponse/response bodies)"]
  performanceConcerns:
    - "extractUsageFromResponse() re-parses the full provider response body shape on every single request to locate the usage block"
  behavior: { streaming: true, cancellation: null, concurrency: null }
  edgeCases:
    - "GAP: fallback attempts (other accounts/providers tried and rejected before the winning one) are not recorded anywhere — usageHistory and requestDetails only ever see the final attempt. AIGate has no source data to reconstruct 'how many accounts did this request burn through' from 9router's persisted usage rows."
    - "GAP: latency.ttft = 0 is used both as the literal value for a genuinely instant response and as the 'not measured on this code path' default for every non-streaming/error case — the two cannot be told apart from the stored data."
  evidence:
    - { file: open-sse/handlers/chatCore/requestDetail.js, line: 24, note: "extractUsageFromResponse — three provider response shapes" }
    - { file: open-sse/handlers/chatCore/requestDetail.js, line: 67, note: "buildRequestDetail — latency/tokens defaults, ttft:0 baked in" }
    - { file: open-sse/handlers/chatCore/requestDetail.js, line: 103, note: "saveUsageStats — cost NOT computed here, only tokens/provider/model passed on" }
    - { file: open-sse/handlers/chatCore.js, line: 381, note: "error branch: latency.total computed, ttft hardcoded 0" }
    - { file: open-sse/handlers/chatCore.js, line: 455, note: "provider-error branch: same ttft:0 pattern" }
  newModule: usage
  parityStatus: traced
  labels: [REFERENCE_BEHAVIOR]

- id: usage.write-not-synchronous
  group: Usage
  feature: Per-request usage capture
  subFeature: Whether the usage write blocks the HTTP response
  trigger: saveUsageStats()/saveRequestUsage() called from any chat/embeddings success or error path
  input: "{provider, model, tokens, connectionId, apiKey, endpoint}"
  output: "A pending usageHistory write that races the HTTP response instead of gating it"
  businessRules:
    - "Every call site invokes saveRequestUsage(...).catch(() => {}) without awaiting it — the promise is fired and its rejection swallowed, the caller moves on immediately"
    - "saveRequestUsage's own function body starts with `const db = await getAdapter();` — even the portion of the function that runs before the caller regains control is minimal; the DB work happens after a yield to the event loop"
    - "Because the write is unawaited and off the critical path, it is NOT synchronous with the response and does not sit on the hot path — the condition stated for labeling this IMPLEMENTATION_ACCIDENT does not hold here"
  state:
    reads: []
    writes: ["usageHistory / usageDaily"]
    runtimeOnly: []
  dependencies: ["routing.usage-recording-timing", "routing.success-callback-timing"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: []
  persistence: ["usageHistory row (eventually, not guaranteed before the client sees a response)"]
  performanceConcerns: []
  behavior: { streaming: true, cancellation: null, concurrency: "Fire-and-forget: multiple in-flight saveRequestUsage calls for concurrent requests interleave freely; each is its own transaction" }
  edgeCases:
    - "A process crash between the HTTP response being sent and the fire-and-forget promise settling drops the usage row silently — no retry, no dead-letter, no log beyond a swallowed .catch(() => {})"
  evidence:
    - { file: open-sse/handlers/chatCore/requestDetail.js, line: 124, note: "saveRequestUsage(...).catch(() => {}) — not awaited" }
    - { file: src/lib/db/repos/usageRepo.js, line: 243, note: "saveRequestUsage's first statement is itself an await, yielding immediately" }
    - { file: src/sse/handlers/embeddings.js, line: 140, note: "same fire-and-forget pattern in the embeddings lane" }
  newModule: usage
  parityStatus: traced
  labels: [REFERENCE_BEHAVIOR]

- id: usage.pending-request-orphan-timeout
  group: Usage
  feature: Live request tracking
  subFeature: trackPendingRequest and the PENDING_TIMEOUT_MS watchdog
  trigger: trackPendingRequest(model, provider, connectionId, started, error) called at request dispatch, completion, disconnect and error points
  input: "model, provider, connectionId, started (bool), error (bool)"
  output: "In-memory pending counters (global._pendingRequests) used to render the 'active requests' widget"
  businessRules:
    - "started=true increments byModel[modelKey] and byAccount[connectionId][modelKey], then (re)arms a 60000ms (PENDING_TIMEOUT_MS) setTimeout keyed by `${connectionId}|${modelKey}`"
    - "started=false decrements both counters (clamped to >= 0 via Math.max) and clears the timer — this is the normal 'request finished' signal, called from success, error, disconnect and stream-complete paths"
    - "If the timer fires before a matching started=false ever arrives (unhandled exception before onError/onDisconnect wiring, process anomaly), it force-resets the counter to 0 for that model/account and deletes itself — a watchdog against a permanently-stuck 'N active requests' badge, not a request-level timeout that cancels anything"
    - "The timer is a plain Node setTimeout, not unref'd, scoped per connectionId+modelKey so a second started=true for the same pair replaces (clearTimeout + reschedule) rather than stacking timers"
  state:
    reads: []
    writes: []
    runtimeOnly: ["global._pendingRequests.byModel", "global._pendingRequests.byAccount", "global._pendingTimers"]
  dependencies: []
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: "60000ms per model+account pair (PENDING_TIMEOUT_MS), resets the counter, does not cancel or retry the underlying request", quota: null }
  errorCases: []
  sideEffects: ["scheduleStatsEvent('pending') — debounced SSE push to /api/usage/stream subscribers"]
  persistence: []
  performanceConcerns: []
  behavior: { streaming: false, cancellation: null, concurrency: "Multiple started=false calls for the same request (e.g. both onDisconnect and the natural completion path) are tolerated by the Math.max(0, ...) clamp but not detected as a double-call" }
  edgeCases:
    - "trackPendingRequest is purely in-memory counting; it has no relationship to any provider-side rate limit or quota — 'pending' here means 'a request this process dispatched and has not yet resolved', nothing else"
  evidence:
    - { file: src/lib/db/repos/usageRepo.js, line: 12, note: "PENDING_TIMEOUT_MS = 60 * 1000" }
    - { file: src/lib/db/repos/usageRepo.js, line: 152, note: "trackPendingRequest signature and counter math" }
    - { file: src/lib/db/repos/usageRepo.js, line: 172, note: "started branch: clearTimeout + reschedule" }
    - { file: src/lib/db/repos/usageRepo.js, line: 174, note: "timer callback: force-reset to 0 on orphan timeout" }
    - { file: open-sse/handlers/chatCore.js, line: 305, note: "trackPendingRequest(..., true) at dispatch" }
    - { file: open-sse/handlers/chatCore.js, line: 475, note: "trackDone = () => trackPendingRequest(..., false) — normal completion" }
  newModule: usage
  parityStatus: traced
  labels: [REFERENCE_BEHAVIOR]

