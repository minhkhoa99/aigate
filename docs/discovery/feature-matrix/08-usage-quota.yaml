- id: usage.history-write-dedup-transaction
  group: Usage
  feature: Usage persistence
  subFeature: saveRequestUsage — dedup check, single-transaction 3-way write
  trigger: Any fire-and-forget saveRequestUsage(entry) call
  input: "{provider, model, tokens, connectionId, apiKey, endpoint, timestamp?}"
  output: "One usageHistory row, one usageDaily upsert, one _meta lifetime counter increment — or a no-op endpoint patch if a matching row already exists"
  businessRules:
    - "Before inserting, a SELECT looks for an existing usageHistory row with the same timestamp (ISO string, millisecond precision), provider, model, connectionId, apiKey, promptTokens and completionTokens"
    - "If found, no new row is written — at most the existing row's endpoint is backfilled if it was previously null"
    - "If not found, all three writes (history insert, usageDaily upsert via aggregateEntryToDay, _meta.totalRequestsLifetime increment) happen inside one db.transaction(), justified in-source by better-sqlite3 being synchronous so no other JS runs mid-transaction in the same process"
    - "pushToRing() and the debounced stats-event only fire when a new row was actually inserted (inserted === true)"
  state:
    reads: ["usageHistory (dedup SELECT)", "usageDaily (current day row)", "_meta.totalRequestsLifetime"]
    writes: ["usageHistory", "usageDaily", "_meta.totalRequestsLifetime"]
    runtimeOnly: []
  dependencies: ["pricing.cost-calculation-cache-inclusive"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases:
    - { code: INTERNAL_ERROR, when: "the transaction throws (e.g. adapter failure)", partial: false }
  sideEffects: ["pushToRing", "scheduleStatsEvent('update', 250ms)"]
  persistence: ["usageHistory row", "usageDaily aggregate row", "_meta.totalRequestsLifetime"]
  performanceConcerns: []
  behavior: { streaming: false, cancellation: null, concurrency: "Single-process, synchronous better-sqlite3 transaction — no cross-request race inside one process; the whole function is still wrapped in try/catch so a failure only logs, it never throws back to the fire-and-forget caller" }
  edgeCases: []
  evidence:
    - { file: src/lib/db/repos/usageRepo.js, line: 254, note: "comment: all 3 writes in ONE transaction, sync DB so no mid-transaction race" }
    - { file: src/lib/db/repos/usageRepo.js, line: 256, note: "dedup SELECT before insert" }
    - { file: src/lib/db/repos/usageRepo.js, line: 274, note: "existing-row branch: endpoint backfill only, no new row" }
    - { file: src/lib/db/repos/usageRepo.js, line: 281, note: "usageHistory INSERT" }
    - { file: src/lib/db/repos/usageRepo.js, line: 291, note: "usageDaily upsert via aggregateEntryToDay" }
    - { file: src/lib/db/repos/usageRepo.js, line: 300, note: "_meta.totalRequestsLifetime atomic increment" }
  newModule: usage
  parityStatus: traced
  labels: [SUSPECTED_BUG]
  suspicion:
    expected: "Every completed request that calls saveRequestUsage produces its own usageHistory row"
    actual: "A request whose ISO-millisecond timestamp, provider, model, connectionId, apiKey, promptTokens and completionTokens all match the most recently matching prior row is treated as a duplicate: no new row is inserted, no usageDaily counts are added, no lifetime counter increment happens — only the endpoint column may be backfilled"
    impact: "Genuinely distinct requests that happen to land in the same millisecond with identical provider/model/account/token counts (e.g. rapid retries, fixed-size embeddings calls) are silently undercounted in usageHistory, usageDaily aggregates, byModel/byAccount stats and the lifetime request counter"

