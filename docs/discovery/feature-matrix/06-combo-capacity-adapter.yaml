    - { file: open-sse/services/combo.js, line: 191, note: "rotateModelsFromIndex — shift+push rotation of the full array" }
    - { file: open-sse/services/combo.js, line: 220, note: "currentIndex = state.index % models.length" }
    - { file: open-sse/services/combo.js, line: 224, note: "nextUseCount >= normalizedStickyLimit -> advance index, reset counter" }
