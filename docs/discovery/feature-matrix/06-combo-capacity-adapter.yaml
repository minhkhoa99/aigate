- id: combo.mode-fallback
  group: Model combo
  feature: Model combo
  subFeature: "\"Fallback\" strategy — sequential try-until-success across combo members"
  trigger: A combo dispatch (routing.combo-dispatch) resolves to comboStrategy "fallback" (the default) or any non-"round-robin"/"fusion" value
  input: "rotatedModels (post rotation + capability auto-switch), body, handleSingleModel callback"
  output: The first successful (2xx) member Response, or an aggregate error/503 Response after every member is exhausted
  businessRules:
    - "handleComboChat tries rotatedModels[0], [1], ... in order; it moves to the next model when handleSingleModel throws, OR when the non-2xx result's checkFallbackError classification says shouldFallback:true"
    - "checkFallbackError's shouldFallback:false path (per fallback.error-classification: noAuth connections, or pre-dispatch validation errors) returns that failing Response to the client immediately — the remaining combo members are never tried"
    - "A 502/503/504 whose classifier cooldownMs is > 0 and <= 5000 ms is awaited in-process (await new Promise(setTimeout)) before moving to the next model, giving a briefly-overloaded member one grace window; longer cooldowns are not waited on before falling through"
    - "When every member fails: the returned status is the last member's status (or 503 if none set one), UNLESS the last error text contains 'no credentials' (case-insensitive), which forces status 503 regardless of what the last member actually returned"
    - "retryAfter in the final aggregate error is the earliest of any member's parsed retryAfter across the whole loop, not just the last member's"
  state:
    reads: []
    writes: []
    runtimeOnly: []
  dependencies: ["routing.combo-dispatch", "fallback.error-classification", "combo.rotation-state-lifecycle"]
  providerInteraction: null
  fallback: { hasFallback: true, retry: "In-place retry per member belongs to fallback.executor-retry-budget; this loop only decides next-member fallback", timeout: null, quota: null }
  errorCases:
    - { code: PROVIDER_UNAVAILABLE, when: "handleSingleModel throws, or returns a non-2xx result the classifier says to fall back from, for every model in rotatedModels", partial: false }
    - { code: INVALID_REQUEST, when: "the first attempted member's classifier returns shouldFallback:false (e.g. a pre-dispatch validation error) — returned to the client immediately without trying later members", partial: false }
  sideEffects: ["log.info per attempt (COMBO tag, 1-based index/total); log.warn on a member failure or thrown error; log.warn 'All models failed' once the loop exhausts every member"]
  persistence: []
  performanceConcerns:
    - "Fully sequential — attempt N+1 does not start until attempt N's Response (and any transient-cooldown wait) resolves; there is no deadline across the whole combo beyond each member's own executor retry budget"
  behavior: { streaming: true, cancellation: null, concurrency: "One member in flight at a time — the opposite of fusion's fan-out" }
  edgeCases:
    - "A failing member's Response body is read via result.clone().json() (the clone, not the original) so the original Response is still consumable — but only the success branch actually returns the original Response object onward; a failing one is discarded after its clone is inspected"
    - "If parsing the failing member's JSON body throws (non-JSON error body), the parse error is silently swallowed and the raw statusText is used as errorText instead"
