    - { file: open-sse/services/combo.js, line: 337, note: "shouldFallback false -> return this failing result to the client, no further members tried" }
    - { file: open-sse/services/combo.js, line: 345, note: "transient 502/503/504 with cooldownMs<=5000 -> await cooldown before next member" }
    - { file: open-sse/services/combo.js, line: 367, note: "allDisabled ('no credentials' in lastError) forces status 503 on the aggregate error" }
