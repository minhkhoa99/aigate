    reads: []
    writes: []
    runtimeOnly: []
  dependencies: ["combo.mode-fusion-degrade", "combo.fusion-panel-concurrency-unbounded"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: "panelHardTimeoutMs (default 90000 ms) absolute cap; stragglerGraceMs (default 8000 ms) grace once minPanel (default 2, floor 2) have succeeded", quota: null }
  errorCases: []
  sideEffects: ["log.info panel size/members/judge/quorum at fan-out start", "log.info elapsed ms once collectPanel resolves"]
  persistence: []
  performanceConcerns:
    - "Best-case wall time is roughly (time for the fastest minPanel members) + stragglerGraceMs; a slow provider under panelHardTimeoutMs still occupies the event loop and the upstream connection until it eventually settles even though its result is discarded"
  behavior: { streaming: false, cancellation: "No AbortController anywhere in the panel path — a straggler keeps running server-side after being dropped, it is only ignored, not cancelled", concurrency: "See combo.fusion-panel-concurrency-unbounded" }
  edgeCases:
    - "If exactly minPanel calls succeed and others are still in flight when the grace timer fires, those in-flight slots stay `undefined` in `out` (not {__timeout} or {__error}) — the caller's loop treats an undefined slot identically to a straggler/timeout drop"
  evidence:
    - { file: open-sse/services/combo.js, line: 472, note: "FUSION_DEFAULTS: minPanel 2, stragglerGraceMs 8000, panelHardTimeoutMs 90000" }
    - { file: open-sse/services/combo.js, line: 479, note: "withTimeout — resolves {__timeout:true} at ms if the wrapped promise hasn't settled" }
    - { file: open-sse/services/combo.js, line: 509, note: "collectPanel hard timer set to panelHardTimeoutMs" }
    - { file: open-sse/services/combo.js, line: 518, note: "ok >= minPanel && !graceTimer -> start the stragglerGraceMs grace timer" }
    - { file: open-sse/services/combo.js, line: 562, note: "minPanel clamp: Math.min(Math.max(2, cfg.minPanel), panel.length)" }
