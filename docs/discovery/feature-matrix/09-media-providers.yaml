- id: media.embedding-lane
  group: Media Providers
  feature: Embedding
  subFeature: "POST /v1/embeddings — account-selection loop + embeddingsCore provider dispatch"
  trigger: POST /v1/embeddings
  input: "{ model: \"provider/model\", input: string|string[], encoding_format?, dimensions? }"
  output: "OpenAI-shaped embeddings response, or an error body"
  businessRules:
    - "handleEmbeddings resolves provider/model via getModelInfo, then runs its own while(true) credential+fallback loop (getProviderCredentials / markAccountUnavailable / clearAccountError / checkAndRefreshToken, all imported from the same src/sse/services/auth.js and tokenRefresh.js the chat lane uses) before calling handleEmbeddingsCore once per attempt"
    - "embeddingsCore dispatches to a per-provider adapter (open-sse/handlers/embeddingProviders/{id}.js); a misconfigured adapter (e.g. selfhosted-embedding with no baseUrl) throws inside buildUrl/buildHeaders/buildBody, which is caught and turned into a 400 naming the reason rather than escaping as a 500 or hanging request — an explicit design choice called out in the handler's own comment"
    - "On success, usage is only recorded when exactEmbeddingUsage() can derive an exact (non-estimated) token count from the provider's raw usage block (prompt_tokens/input_tokens present, completion_tokens===0, total_tokens===prompt_tokens) — an estimated or malformed usage object silently skips saveRequestUsage entirely rather than recording an approximate figure"
  state:
    reads: ["providerConnections (via getProviderCredentials)", "PROVIDER_MEDIA[id].embeddingConfig (indirectly, via getEmbeddingAdapter)"]
    writes: ["providerConnections (lock/testStatus fields via markAccountUnavailable/clearAccountError)", "usageHistory (via saveRequestUsage, only for exact usage)"]
    runtimeOnly: []
  dependencies: ["routing.account-fallback-loop", "account.lock-storage-persistence", "account.clear-error-on-success", "routing.usage-recording-timing"]
  providerInteraction: "POST to the provider's embeddings endpoint (adapter-built URL/headers/body)"
  fallback: { hasFallback: true, retry: "one 401/403 refresh-and-retry inside embeddingsCore; account rotation via the outer while loop on markAccountUnavailable's shouldFallback", timeout: "FETCH_CONNECT_TIMEOUT_MS via AbortSignal.timeout when available", quota: "allRateLimited short-circuit surfaces retryAfter/retryAfterHuman from getProviderCredentials" }
  errorCases:
    - { code: INVALID_REQUEST, when: "missing model or input, or input is neither string nor array", partial: false }
    - { code: AUTH_ERROR, when: "no credentials at all for the provider (excludeConnectionIds empty)", partial: false }
    - { code: PROVIDER_UNAVAILABLE, when: "all accounts rate-limited/locked (credentials.allRateLimited)", partial: false }
    - { code: PROVIDER_UNAVAILABLE, when: "every account exhausted after rotation (excludeConnectionIds non-empty, no credentials left)", partial: false }
  sideEffects: []
  persistence: ["usageHistory row, only when usage is exact (not estimated)"]
  performanceConcerns: []
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "15 providers declare embeddingConfig in the registry; a provider outside that set 400s with \"does not support embeddings\" from embeddingsCore rather than never appearing in getProvidersByKind(\"embedding\") — the dashboard-listing gate (serviceKinds) and the runtime-dispatch gate (getEmbeddingAdapter) are two separate checks that must be kept in sync by hand"
  evidence:
