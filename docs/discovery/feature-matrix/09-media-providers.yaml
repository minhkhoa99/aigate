- id: media.image-lane
  group: Media Providers
  feature: Text to Image
  subFeature: "POST /v1/images/generations — account-selection loop + imageGenerationCore provider dispatch, including codex's SSE streaming path"
  trigger: POST /v1/images/generations
  input: "{ model, prompt, n?, size?, output_format? }, Accept: text/event-stream (opt-in streaming), ?response_format=binary (opt-in raw bytes)"
  output: "OpenAI-shaped images response (JSON with data[].b64_json/url); raw image bytes when binaryOutput; an SSE Response passthrough for codex when streamToClient is requested and codex's adapter honors it"
  businessRules:
    - "wantsStream is derived purely from the inbound Accept header (Accept: text/event-stream) and passed through as streamToClient; imageGenerationCore only actually streams when the selected provider's adapter.parseResponse returns { sseResponse } — codex is the only adapter observed doing so, every other provider ignores streamToClient and returns a normal JSON/binary Response regardless of the client's Accept header"
    - "binaryOutput (?response_format=binary) decodes the first result's b64_json (or fetches its url and base64-encodes it) into raw bytes, returned with a Content-Type matching output_format (png/jpeg/webp) — this happens after normalize(), so it applies uniformly across every adapter's already-OpenAI-shaped output"
    - "Adapters that set useExecutor/executeViaExecutor skip the generic buildUrl/buildHeaders/buildBody/fetch path entirely and instead reuse that provider's full chat executor (401/403 refresh handling included) — a second, executor-driven dispatch style distinct from the generic adapter path most providers use"
  state:
    reads: ["providerConnections (via getProviderCredentials)"]
    writes: ["providerConnections (lock/testStatus via markAccountUnavailable/clearAccountError)"]
    runtimeOnly: []
  dependencies: ["routing.account-fallback-loop", "account.lock-storage-persistence"]
  providerInteraction: "POST to the provider's image-generation endpoint; codex's is a long-lived SSE connection when streaming"
  fallback: { hasFallback: true, retry: "one 401/403 refresh-and-retry inside imageGenerationCore", timeout: null, quota: null }
  errorCases:
    - { code: INVALID_REQUEST, when: "missing prompt, or adapter.buildUrl/buildBody/buildHeaders throws (e.g. bad size for that provider)", partial: false }
    - { code: PROVIDER_UNAVAILABLE, when: "all accounts rate-limited/locked", partial: false }
  sideEffects: []
  persistence: []
  performanceConcerns: []
  behavior: { streaming: true, cancellation: null, concurrency: null }
  edgeCases:
    - "18 providers declare imageConfig; runwayml is one of them (imageConfig.baseUrl only) even though its own models[] array also lists two video-kind models with no matching videoConfig (see media.video-lane) — the same registry entry can be complete for one kind and dangling for another"
  evidence:
    - { file: src/sse/handlers/imageGeneration.js, line: 34, note: "wantsStream = Accept header includes text/event-stream" }
    - { file: src/sse/handlers/imageGeneration.js, line: 114, note: "streamToClient: wantsStream passed into handleImageGenerationCore" }
    - { file: open-sse/handlers/imageGenerationCore.js, line: 54, note: "useExecutor/executeViaExecutor branch — bypasses the generic adapter path" }
    - { file: open-sse/handlers/imageGenerationCore.js, line: 179, note: "codex streaming case: parsed.sseResponse returned directly as the Response" }
    - { file: open-sse/handlers/imageGenerationCore.js, line: 198, note: "binaryOutput decode — first.b64_json or urlToBase64(first.url)" }
    - { file: src/app/api/v1/images/generations/route.js, line: 15, note: "POST /v1/images/generations -> handleImageGeneration(request)" }
