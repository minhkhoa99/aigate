- id: media.tts-voice-listing
  group: Media Providers
  feature: Text To Speech
  subFeature: Voice listing — one generic credential-free route plus four dedicated per-provider routes that require a stored connection
  trigger: Dashboard TTS provider/model picker loading available voices
  input: "GET /api/media-providers/tts/voices?provider=edge-tts|local-device|elevenlabs&apiKey=... ; GET /api/media-providers/tts/{deepgram|elevenlabs|inworld|minimax}/voices"
  output: "{ voices, languages, byLang } (generic route) or { languages, byLang } (dedicated routes)"
  businessRules:
    - "The generic /api/media-providers/tts/voices route dispatches through VOICE_FETCHERS[provider] (re-exported from ttsCore.js) and needs no stored connection for edge-tts/local-device; for elevenlabs it instead reads apiKey from the query string, not from a stored providerConnections row — the only voice route that accepts a credential as a request parameter rather than looking one up"
    - "The four dedicated routes (deepgram, elevenlabs, inworld, minimax) all read the FIRST active connection for that exact provider id via getProviderConnections({ provider, isActive: true }) and 400 with \"No <Provider> connection found\" if none exists — no account rotation, no mutex, and no fallback to a second connection of the same provider if the first one's key is invalid"
    - "GET /v1/audio/voices (the OpenAI-style public listing) proxies to a hardcoded PROVIDER_API map covering elevenlabs/deepgram/inworld/edge-tts/local-device but omits minimax — minimax's own dedicated voices route exists and works when called directly, but is not reachable through the public /v1/audio/voices listing endpoint"
  state:
    reads: ["providerConnections (first active row per provider, for deepgram/elevenlabs/inworld/minimax)"]
    writes: []
    runtimeOnly: []
  dependencies: ["media.tts-lane"]
  providerInteraction: "GET to each provider's voices/models listing API (deepgram /v1/models, inworld /tts/v1/voices, elevenlabs's own voices endpoint via fetchElevenLabsVoices, minimax's get_voice endpoint)"
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases:
    - { code: INVALID_REQUEST, when: "generic route's provider query param has no matching VOICE_FETCHERS entry", partial: false }
    - { code: AUTH_ERROR, when: "dedicated route's provider has no active stored connection", partial: false }
    - { code: PROVIDER_UNAVAILABLE, when: "the upstream voices/models call itself fails (non-ok response)", partial: false }
  sideEffects: []
  persistence: []
  performanceConcerns:
    - "Dedicated routes' getProviderConnections({provider, isActive:true}) reads the whole active-connections list and takes connections[0] rather than round-robining or preferring a healthy one — an expired/invalid first connection blocks voice listing even when a second, valid connection for the same provider exists"
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "The dedicated routes comment themselves as intentionally bypassing the auth mutex used for TTS inference (\"Direct DB read - bypass auth mutex ... to avoid blocking on concurrent TTS requests\") — a deliberate consistency/latency tradeoff for a read-only listing call"
  evidence:
    - { file: src/app/api/media-providers/tts/voices/route.js, line: 29, note: "VOICE_FETCHERS[provider] dispatch" }
