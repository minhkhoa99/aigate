    - { file: src/sse/handlers/embeddings.js, line: 118, note: "checkAndRefreshToken(provider, credentials) before each attempt" }
    - { file: src/sse/handlers/embeddings.js, line: 138, note: "exactEmbeddingUsage(result.usage) gate before saveRequestUsage" }
    - { file: open-sse/handlers/embeddingsCore.js, line: 32, note: "getEmbeddingAdapter(provider) — 400 when no adapter" }
