# Trace: Console Log, Remote functionality (Task 18)

- id: console.ring-buffer-capacity
  group: Console Log
  feature: Console log capture
  subFeature: Ring buffer capacity enforcement and overflow behavior
  trigger: Any console.log/info/warn/error/debug call anywhere in the Next.js process once initConsoleLogCapture() has patched the console object (triggered by importing api/translator/console-logs or console-logs/stream — see translator.playground-console-logs)
  input: "Arbitrary console.*(...args) call from anywhere in the process"
  output: "Line appended to the in-memory logs array; oldest lines evicted once CONSOLE_LOG_CONFIG.maxLines (200) is exceeded"
  businessRules:
    - "The cap is enforced only in appendLine() on the server (src/lib/consoleLogBuffer.js): every push checks state.logs.length > maxLines and, if so, replaces the array with logs.slice(-maxLines) — a hard 200-line ring, not a rolling window with a separate write cursor"
    - "Overflow is a silent drop: slice(-maxLines) simply discards the oldest lines with no counter, flag, or 'N lines truncated' marker surfaced to callers of getConsoleLogs() or to /api/translator/console-logs' GET response"
    - "There is no client-side cap — the dashboard playground renders whatever the server hands it (buffered GET array or streamed SSE lines); nothing tells the client what was dropped, so a long-lived tab that has accumulated lines across multiple 'lines'/'line' SSE events could display more than 200 lines until it re-syncs via a fresh 'init' replay"
  state:
    reads: []
    writes: ["in-memory logs array (global._consoleLogBufferState.logs)"]
    runtimeOnly: ["the entire ring buffer — process-lifetime only, reset on restart"]
  dependencies: ["translator.playground-console-logs"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: []
  persistence: []
  performanceConcerns:
    - "appendLine() runs synchronously inside every wrapped console.* call (initConsoleLogCapture), so a hot path that logs heavily pays the array-slice cost inline before the real console output is written"
  behavior: { streaming: false, cancellation: null, concurrency: "logs array is process-global and shared by every concurrent request/emit; no locking, but single-threaded Node means no torn writes" }
  edgeCases:
    - "CONSOLE_LOG_CONFIG.maxLines is a shared constant object (src/shared/constants/config.js) that also holds pollIntervalMs, so raising the cap for debugging means editing a config object whose other key is an unrelated dashboard poll interval, not a dedicated console-log config"
  evidence:
    - { file: src/lib/consoleLogBuffer.js, line: 68, note: "cap check: state.logs.length > maxLines" }
    - { file: src/lib/consoleLogBuffer.js, line: 69, note: "silent drop via state.logs.slice(-maxLines), no counter or flag" }
    - { file: src/shared/constants/config.js, line: 58, note: "CONSOLE_LOG_CONFIG.maxLines = 200" }
    - { file: src/lib/consoleLogBuffer.js, line: 89, note: "appendLine invoked synchronously inside the monkeypatched console[level]" }
  newModule: tooling
  parityStatus: traced
  labels: [REFERENCE_BEHAVIOR]

- id: console.batched-flush-and-formatting
  group: Console Log
  feature: Console log capture
  subFeature: Batched SSE flush timer and log line formatting (ANSI strip, arg serialization)
  trigger: Each console.* call while capture is patched; a debounced flush fires at most every 100ms or immediately once 50 pending lines accumulate
  input: "console.*(...args) call arguments (strings, Errors, objects)"
  output: "A formatted, ANSI-stripped string line pushed to state.logs and state.pendingLines, eventually emitted as a 'lines' event on the shared EventEmitter for /console-logs/stream subscribers"
  businessRules:
    - "formatArg() strips ANSI escape codes (terminal color codes) from strings, Error stacks/messages, and JSON-stringified objects alike (src/lib/consoleLogBuffer.js) so the dashboard playground never renders raw \\x1b[...m sequences"
    - "scheduleFlush() debounces at FLUSH_INTERVAL_MS=100ms via setTimeout, but appendLine() bypasses the debounce and flushes immediately once pendingLines reaches MAX_BATCH_LINES=50 in the same call, clearing any pending timer first — a burst of 50+ log lines in one microtask flushes as one large 'lines' batch instead of waiting out the 100ms window"
    - "The flush timer is unref()'d (scheduleFlush) so a pending flush never keeps the Node process alive on its own — an intentional 'this is debug tooling, not a durability guarantee' choice"
  state: { reads: [], writes: ["state.pendingLines (drained on each flush)"], runtimeOnly: ["flushTimer — a live setTimeout handle stored on the global state object"] }
  dependencies: ["translator.playground-console-logs"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: []
  persistence: []
  performanceConcerns:
    - "formatArg() runs JSON.stringify on every non-string, non-Error argument on every console call while patched — an app that logs large objects heavily pays this serialization cost even when no playground session is open, because the patch stays installed for the process lifetime once initConsoleLogCapture() has run once"
  behavior: { streaming: true, cancellation: null, concurrency: "pendingLines is a single shared array drained by whichever flush fires first (timer or batch threshold); no per-subscriber queue" }
  edgeCases:
    - "If a caller passes a circular object to console.log, JSON.stringify throws inside formatArg's try, and the catch falls back to String(arg) — ANSI stripping still applies to that fallback string"
  evidence:
    - { file: src/lib/consoleLogBuffer.js, line: 27, note: "FLUSH_INTERVAL_MS = 100" }
    - { file: src/lib/consoleLogBuffer.js, line: 28, note: "MAX_BATCH_LINES = 50" }
    - { file: src/lib/consoleLogBuffer.js, line: 41, note: "state.flushTimer?.unref?.() — debug buffer never holds the process open" }
    - { file: src/lib/consoleLogBuffer.js, line: 56, note: "stripAnsi applied to plain strings" }
    - { file: src/lib/consoleLogBuffer.js, line: 59, note: "JSON.stringify(arg) wrapped in stripAnsi; catch falls back to String(arg)" }
    - { file: src/lib/consoleLogBuffer.js, line: 72, note: "MAX_BATCH_LINES reached -> immediate flush bypassing the 100ms debounce" }
  newModule: tooling
  parityStatus: traced
  labels: [REFERENCE_BEHAVIOR]

- id: console.global-state-hot-reload-guard
  group: Console Log
  feature: Console log capture
  subFeature: Why the ring buffer lives on global._* and the hot-reload guard that protects it
  trigger: Module (re-)evaluation of src/lib/consoleLogBuffer.js — normally once per process, but can happen more than once under Next.js dev-mode hot module reload / Turbopack fast refresh
  input: none
  output: "A single shared state object (logs, emitter, patched flag) surviving across module re-evaluations"
  businessRules:
    - "state is stored on global._consoleLogBufferState specifically because Next.js (especially dev-mode HMR/Turbopack) can re-evaluate a module's top-level code more than once per OS process — a plain module-scope `const state = {...}` would silently reset to a fresh empty buffer/emitter on every reload, dropping all buffered logs and detaching every already-open SSE subscriber from the old emitter instance"
    - "The guard is two-layered: the whole state object is created only `if (!global._consoleLogBufferState)`, and a second, narrower guard re-creates just `state.emitter` if a stale global survived a reload but somehow lost its EventEmitter — the inline comment 'handles hot reload with stale global' makes the intent explicit"
    - "This is a framework artifact (Next.js module re-evaluation semantics), not a business requirement — AIGate does not need to reproduce the global._* mechanism itself, only the underlying requirement it protects: exactly one console-log ring buffer + emitter for the process lifetime"
  state: { reads: ["global._consoleLogBufferState"], writes: ["global._consoleLogBufferState (created once, patched idempotently)"], runtimeOnly: ["global._consoleLogBufferState.emitter, .logs, .patched, .originals"] }
  dependencies: ["translator.playground-console-logs"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: []
  persistence: []
  performanceConcerns: []
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "state.patched (set once by initConsoleLogCapture) is itself part of the same global object, so a hot-reloaded module correctly sees console already patched and skips re-wrapping console[level] a second time — without the shared global, a reload would double-patch and each log line would print/append twice"
  evidence:
    - { file: src/lib/consoleLogBuffer.js, line: 6, note: "global._consoleLogBufferState created only if absent" }
    - { file: src/lib/consoleLogBuffer.js, line: 19, note: "hot-reload guard: re-create emitter if a stale global lost it" }
    - { file: src/lib/consoleLogBuffer.js, line: 84, note: "state.patched guard prevents double-patching console on module re-evaluation" }
  newModule: tooling
  parityStatus: traced
  labels: [IMPLEMENTATION_ACCIDENT]

