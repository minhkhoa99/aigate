- id: tunnel.cloudflare-quick-tunnel-enable-disable
  group: Remote functionality
  feature: Tunnel exposure
  subFeature: POST /api/tunnel/enable and /api/tunnel/disable — Cloudflare quick-tunnel lifecycle
  trigger: Dashboard Endpoint page Enable/disable action for the Cloudflare tunnel row (client-side gated, see tunnel.enable-lacks-server-side-security-gate)
  input: none (both POST with empty body)
  output: "enable: {success, tunnelUrl, shortId, publicUrl, alreadyRunning?}; disable: {success:true}"
  businessRules:
    - "enableTunnel() first checks if cloudflared is already running AND both the direct trycloudflare.com URL and the public https://r{shortId}.abc-tunnel.us URL probe alive — only then does it reuse the existing tunnel instead of respawning, to avoid a stale socket surviving a network change"
    - "On a fresh spawn, the tunnel is registered with 9router's own worker (POST {WORKER_URL}/api/tunnel/register) to bind shortId -> tunnelUrl, before the public *.abc-tunnel.us URL is health-checked — the public URL depends on this external worker being reachable"
    - "POST /api/tunnel/enable waits a hardcoded DNS_WARMUP_DELAY_MS=8000ms after the tunnel registers, purely to let Cloudflare edge DNS propagate, before returning to the caller — a fixed sleep, not a poll-until-ready"
    - "disableTunnel() sets svc.cancelToken.cancelled=true first, specifically so that an enable already in flight (e.g. a slow spawn racing a user's disable click) cannot resurrect tunnelEnabled/tunnelUrl in settings after disable has cleared them (throwIfCancelled checks are sprinkled through enableTunnel)"
  state:
    reads: ["DATA_DIR/tunnel/state.json (existing shortId/tunnelUrl on the reuse path)"]
    writes: ["settings.tunnelEnabled/tunnelUrl", "DATA_DIR/tunnel/state.json"]
    runtimeOnly: ["svc.cancelToken, svc.spawnInProgress, svc.activeLocalPort (module-scope in cloudflare/manager.js)"]
  dependencies: ["tunnel.remote-access-state-machine"]
  providerInteraction: "Cloudflare's trycloudflare.com quick-tunnel edge + 9router's own tunnel-registration worker (WORKER_URL)"
  fallback: { hasFallback: true, retry: null, timeout: "waitForHealth polls the public URL with its own internal timeout; DNS_WARMUP_DELAY_MS is a fixed 8s post-registration wait", quota: null }
  errorCases:
    - { code: INTERNAL_ERROR, when: "enableTunnel()/disableTunnel() throws (cloudflared spawn/exit error, health check failure) — caught and returned as {error: message} with status 500", partial: false }
  sideEffects:
    - "killCloudflared(localPort) unconditionally kills any existing cloudflared process (by tracked PID and by matching the port in its command line) before every fresh spawn"
  persistence: ["settings.tunnelEnabled / settings.tunnelUrl (SQLite settings row)", "DATA_DIR/tunnel/state.json {shortId, tunnelUrl}"]
  performanceConcerns:
    - "The 8s DNS_WARMUP_DELAY_MS in enable/route.js blocks the HTTP response for the full duration on every enable call, even the reuse (alreadyRunning) path — enableTunnel() itself returns quickly on reuse, but the route still waits out the full 8s before responding"
  behavior: { streaming: false, cancellation: "cancelToken checked at multiple points inside enableTunnel; a disable mid-enable causes the in-flight enable to throw 'tunnel cancelled', which is swallowed (not logged as an error) rather than surfaced to the original caller", concurrency: "svc is a module-scope singleton per process — concurrent enable calls race on the same svc.cancelToken/spawnInProgress" }
  edgeCases:
    - "killCloudflared's platform-specific pkill/PowerShell filter matches ':${port}' with a boundary guard specifically to avoid a stale process surviving a respawn because a port-number substring (e.g. 20128 vs 201280) collided"
  evidence:
    - { file: src/app/api/tunnel/enable/route.js, line: 6, note: "DNS_WARMUP_DELAY_MS = 8000" }
    - { file: src/app/api/tunnel/enable/route.js, line: 15, note: "fixed 8s sleep after enableTunnel() resolves, before responding" }
    - { file: src/lib/tunnel/cloudflare/manager.js, line: 47, note: "reuse path double-probes direct+public URL before trusting an existing tunnel" }
    - { file: src/lib/tunnel/cloudflare/manager.js, line: 85, note: "registerTunnelUrl call to 9router's own worker before the public health check" }
    - { file: src/lib/tunnel/cloudflare/manager.js, line: 116, note: "disableTunnel sets cancelToken.cancelled=true before killing the process" }
    - { file: src/lib/tunnel/cloudflare/cloudflared.js, line: 420, note: "killCloudflared kills the tracked PID plus port-matched processes before every respawn" }
    - { file: src/app/api/tunnel/disable/route.js, line: 8, note: "POST handler calls disableTunnel() then re-runs configureTunnelMonitoring off the fresh settings" }
  newModule: tooling
  parityStatus: traced
  labels: [REFERENCE_BEHAVIOR]

- id: tunnel.status-polling-and-caching
  group: Remote functionality
  feature: Tunnel exposure
  subFeature: GET /api/tunnel/status — coalesced polling across both lanes plus download progress
  trigger: Dashboard Endpoint page polling both tunnel lanes' live state
  input: none
  output: "{ tunnel: {enabled, settingsEnabled, tunnelUrl, shortId, publicUrl, running}, tailscale: {enabled, settingsEnabled, tunnelUrl, running, loggedIn}, download: {downloading, progress} }"
  businessRules:
    - "A process-global 3s cache (global.__tunnelStatusCache — the same 'survive Next.js hot reload' pattern as consoleLogBuffer's global._*) coalesces rapid dashboard polls into one pair of underlying probes; the inline comment notes the underlying probes already self-cache for 10s, so this is a second, shorter coalescing layer on top"
    - "Download progress (cloudflared binary fetch) is deliberately excluded from the 3s cache and read live on every call via getDownloadStatus(), so the UI's download progress bar updates smoothly even while the rest of the payload is served from cache"
    - "enabled is derived as settingsEnabled && running for both lanes — a persisted 'enabled' setting alone never reports as enabled if the live process probe disagrees, but nothing here clears the stale settings flag (see tunnel.remote-access-state-machine)"
  state: { reads: ["settings.tunnelEnabled/tunnelUrl", "settings.tailscaleEnabled/tailscaleUrl", "cloudflared PID liveness", "tailscale daemon/login/running probes", "global.__tunnelStatusCache"], writes: ["global.__tunnelStatusCache (value, fetchedAt)"], runtimeOnly: ["global.__tunnelStatusCache"] }
  dependencies: ["tunnel.remote-access-state-machine"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases:
    - { code: INTERNAL_ERROR, when: "either probe throws — caught and returned as {error: message} with status 500", partial: false }
  sideEffects: []
  persistence: []
  performanceConcerns:
    - "STATUS_CACHE_TTL_MS=3000 is a magic number with no override — a dashboard polling faster than 3s (e.g. two open tabs polling independently) gets no fresher data than the cache, by design"
  behavior: { streaming: false, cancellation: null, concurrency: "cache is process-global; concurrent GETs during a cache miss can both trigger a fresh Promise.all probe (no in-flight de-dup lock), briefly doubling probe cost under concurrent first-load" }
  edgeCases:
