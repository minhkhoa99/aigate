- id: tunnel.remote-access-state-machine
  group: Remote functionality
  feature: Tunnel exposure
  subFeature: Full state machine across the 7 /api/tunnel/* routes for both the Cloudflare quick-tunnel and Tailscale Funnel lanes
  trigger: Dashboard Endpoint page tunnel/Tailscale controls
  input: "POST with no body (enable/disable/tailscale-enable/tailscale-disable), POST { sudoPassword? } (tailscale-install), GET (status, tailscale-check)"
  output: "Transitions through not-installed -> installed -> logged-in -> funnel-enabled -> running for Tailscale, or an implicit not-running -> running for Cloudflare (binary auto-downloaded on first enable, no separate install step)"
  businessRules:
    - "Cloudflare lane collapses 'not installed' and 'installed' into one step: GET /api/tunnel/status never reports whether the cloudflared binary is present — enableTunnel() calls spawnQuickTunnel(), which calls ensureCloudflared() internally, auto-downloading the ~30MB binary from GitHub releases on the very first POST /api/tunnel/enable if missing. There is no separate 'install cloudflared' route or button."
    - "Tailscale lane exposes every step as dashboard-visible state: GET /api/tunnel/tailscale-check reports {installed, loggedIn, daemonRunning}; POST /api/tunnel/tailscale-install (SSE) installs the binary and starts the daemon; POST /api/tunnel/tailscale-enable then must (a) start the daemon with a cached/supplied sudo password, (b) check login via isTailscaleLoggedInStrict — if not logged in, returns {needsLogin:true, authUrl} instead of erroring, expecting the caller to open authUrl and retry, (c) call startFunnel — if Tailscale's own Funnel feature isn't turned on for the tailnet, returns {funnelNotEnabled:true, enableUrl} rather than an error, again expecting a manual out-of-band step, then (d) re-verifies via the *Strict probes before persisting tailscaleEnabled=true"
    - "Both lanes persist their 'enabled' bit and public URL into 9router's own settings row (tunnelEnabled/tunnelUrl or tailscaleEnabled/tailscaleUrl), separate from the Cloudflare-lane-only shortId/tunnelUrl file at DATA_DIR/tunnel/state.json which only the Cloudflare code path reads/writes"
    - "'Running' is re-derived on every status poll rather than trusted from the persisted flag: getTunnelStatus() only probes isCloudflaredRunning() (a PID-liveness check) when settings.tunnelEnabled is true (lazy skip), and getTailscaleStatus() only checks isTailscaleRunning() when isTailscaleLoggedIn() is true — so a persisted 'enabled=true' with a dead process reports enabled:false in status without ever clearing the stored settings flag itself"
  state:
    reads: ["settings.tunnelEnabled/tunnelUrl", "settings.tailscaleEnabled/tailscaleUrl", "DATA_DIR/tunnel/state.json (shortId, tunnelUrl)", "cloudflared/tailscale binary presence + daemon/login state (external processes, not DB)"]
    writes: ["settings.tunnelEnabled/tunnelUrl", "settings.tailscaleEnabled/tailscaleUrl", "DATA_DIR/tunnel/state.json"]
    runtimeOnly: ["svc.cancelToken / svc.spawnInProgress per lane (module-scope, not global._*)", "in-memory statusCache in status/route.js (3s TTL)"]
  dependencies: []
  providerInteraction: null
  fallback: { hasFallback: true, retry: "Cloudflare: cloudflared itself retries connection with --retries 99; on an unexpected exit, a watchdog callback (setTunnelUnexpectedExitCallback) triggers a respawn outside this route set", timeout: "spawnQuickTunnel/spawnCloudflared time out after 90s waiting for a URL/connection log line; POST /api/tunnel/enable additionally waits a fixed 8s (DNS_WARMUP_DELAY_MS) after registration before responding", quota: null }
  errorCases:
    - { code: INTERNAL_ERROR, when: "any of the 7 routes' try/catch bodies catch a thrown error and return {error: error.message} with status 500", partial: false }
  sideEffects: []
  persistence: []
  performanceConcerns: []
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "Because 'installed' is invisible for Cloudflare, a user with no network access to GitHub releases only discovers the download failure at Enable-click time, inside the same request that also tries to spawn and health-check the tunnel — status/route.js's separate download-progress field (getDownloadStatus()) exists specifically so the UI can show 'downloading cloudflared...' during that same first-enable call"
  evidence:
    - { file: src/app/api/tunnel/status/route.js, line: 14, note: "status polls both tunnel and tailscale probes in parallel, cached 3s" }
    - { file: src/lib/tunnel/cloudflare/cloudflared.js, line: 139, note: "ensureCloudflared — binary auto-downloaded inside the enable path, no separate install step" }
    - { file: src/app/api/tunnel/tailscale-check/route.js, line: 50, note: "installed/loggedIn/daemonRunning reported as distinct booleans for the Tailscale lane" }
    - { file: src/lib/tunnel/tailscale/manager.js, line: 46, note: "needsLogin+authUrl returned instead of throwing when not logged in" }
    - { file: src/lib/tunnel/tailscale/manager.js, line: 71, note: "funnelNotEnabled+enableUrl returned when Tailscale Funnel itself isn't turned on" }
    - { file: src/lib/tunnel/cloudflare/manager.js, line: 141, note: "getTunnelStatus lazily skips the PID probe when settingsEnabled is false" }
