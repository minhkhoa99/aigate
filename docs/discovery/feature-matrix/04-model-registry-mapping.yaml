- id: catalog.v1beta-generate-content-dispatch
  group: Model mapping
  feature: Gemini-native lane
  subFeature: "POST /v1beta/models/{model}:generateContent and :streamGenerateContent — per-model invocation route under the v1beta/models path, translating to/from the internal OpenAI-shaped pipeline"
  trigger: "A Gemini-native client (Gemini CLI, the @google/genai SDK) invokes a specific model by path+action suffix"
  input: "Path segments [provider?, model:action] (catch-all), Gemini-format request body (contents/systemInstruction/generationConfig)"
  output: "Gemini GenerateContentResponse JSON (non-streaming), or a Gemini-shaped SSE stream (streaming) — never the raw OpenAI shape"
  businessRules:
    - "Streaming is decided purely by the URL action suffix (:generateContent vs :streamGenerateContent), never by a body field — generationConfig.stream is explicitly called out in the source as not a real Gemini API field, so honoring a stream flag in the body would silently diverge from every real Gemini client's actual behavior"
    - "A TTS-shaped request (audio response modality requested, or the model id matches the known Gemini TTS model set) is detected and diverted entirely to forwardGeminiNativeRequest — a direct passthrough to Google's own Gemini API (not through handleChat/the internal routing pipeline at all), with its own account-fallback loop over gemini credentials, markAccountUnavailable/clearAccountError, and a dedicated timeout (GEMINI_NATIVE_TTS_FETCH_TIMEOUT_MS)"
    - "Every other request is converted to the internal OpenAI body shape (convertGeminiToInternal) and dispatched through the same handleChat used by the standard /v1 lane, then the OpenAI response/stream is converted back to Gemini's candidates/usageMetadata shape (or Gemini SSE chunks) on the way out — this route is a pure format adapter around the shared chat pipeline for the non-TTS case, but a fully separate direct-passthrough implementation for the TTS case"
    - "The TTS passthrough path validates the client's API key itself (validateGeminiNativeClientKey, gated on settings.requireApiKey) because it bypasses handleChat's own endpoint.enforce-require-api-key gate entirely — the non-TTS path relies on handleChat's gate instead"
  state:
    reads: ["settings.requireApiKey (TTS path only)", "providerConnections (TTS path, via getProviderCredentials)"]
    writes: ["providerConnections modelLock_* / testStatus (TTS path, via markAccountUnavailable/clearAccountError on the gemini credential loop)"]
    runtimeOnly: []
  dependencies: ["endpoint.rewrite-lanes", "endpoint.enforce-require-api-key", "account.mark-unavailable-lock-reasons", "account.clear-error-on-success"]
  providerInteraction: "Non-TTS: indirect, through handleChat's normal account-selection/executor path. TTS: direct fetch to Google's generativelanguage.googleapis.com/v1beta/models/{model}{action}"
  fallback: { hasFallback: true, retry: "TTS path retries across gemini connections on failure, same shouldFallback contract as account.mark-unavailable-lock-reasons; non-TTS path inherits handleChat's own account-fallback loop", timeout: "TTS path: GEMINI_NATIVE_TTS_FETCH_TIMEOUT_MS AbortController per attempt", quota: null }
  errorCases:
    - { code: INVALID_REQUEST, when: "TTS path: model id fails GEMINI_NATIVE_MODEL_PATTERN (blocks path traversal in the upstream URL)", partial: false }
    - { code: AUTH_ERROR, when: "TTS path: requireApiKey true and the client key is missing/invalid", partial: false }
    - { code: PROVIDER_UNAVAILABLE, when: "TTS path: every gemini connection is exhausted (allRateLimited or no credentials)", partial: false }
    - { code: TIMEOUT, when: "TTS path: upstream fetch aborts after GEMINI_NATIVE_TTS_FETCH_TIMEOUT_MS, classified 504", partial: false }
  sideEffects: []
  persistence: ["providerConnections rows, TTS path only — same lock/status writes as account.mark-unavailable-lock-reasons"]
  performanceConcerns: []
  behavior: { streaming: true, cancellation: "TTS path: request.signal abort is wired to the upstream AbortController and returns 499 Client closed request; non-TTS path inherits handleChat's cancellation behavior", concurrency: null }
  edgeCases:
    - "This route lives under the v1beta/models/ path structurally (a per-model action endpoint), not the v1beta/models listing route (catalog.v1beta-models-listing) — despite sharing a URL prefix, the two share no code"
  evidence:
    - { file: "src/app/api/v1beta/models/[...path]/route.js", line: 94, note: "stream decided solely by the :streamGenerateContent URL suffix" }
    - { file: "src/app/api/v1beta/models/[...path]/route.js", line: 158, note: "isGeminiNativeTtsRequest diverts audio-modality or known-TTS-model requests to the direct passthrough" }
    - { file: "src/app/api/v1beta/models/[...path]/route.js", line: 238, note: "forwardGeminiNativeRequest: own account loop, markAccountUnavailable/clearAccountError, direct fetch to Google" }
    - { file: "src/app/api/v1beta/models/[...path]/route.js", line: 180, note: "validateGeminiNativeClientKey — TTS path's own requireApiKey gate, independent of handleChat's" }
    - { file: "src/app/api/v1beta/models/[...path]/route.js", line: 106, note: "non-TTS path calls handleChat directly with a converted body" }
