# Trace: Model registry, Model mapping (Task 9)
# 9router reference read at E:\9router. Read-only; every evidence line was
# read directly, not inferred from names (behavioral.md §7).
#
# Scope: this file covers the MODEL side of the catalog (which model ids
# exist, what they can do, how a short name resolves to one, and whether a
# vendor's live list agrees with the static registry). The PROVIDER side
# (registry build, transport/oauth shape, connection CRUD) is already traced
# in 02-providers-auth.yaml under catalog.registry-* / catalog.connection-* —
# referenced here via `dependencies`, not re-documented.
#
# Investigation notes (answers to the brief's 5 questions, entry ids in parens):
#   Q1 four tiers, first-match-wins, no cross-tier merge -> catalog.capability-tier-fallback
#   Q2 refine() additive-only, why -> catalog.capability-refine-additive-only
#      (+ catalog.capability-catalog-sync-majority-vote for the untrusted external
#      feed that makes additive-only necessary)
#   Q3 NOT_VISION before VISION_NAME, concrete misclassified id -> catalog.capability-vision-pattern-order
#      (real registry entry found by grep: openrouter.js's
#      "nvidia/llama-nemotron-embed-vl-1b-v2:free", kind:"embedding", contains
#      both "embed" (NOT_VISION) and "vl" (VISION_NAME))
#   Q4 alias resolves before capability lookup; disabled-model gap -> catalog.alias-resolve-before-capability
#      + catalog.alias-disabled-model-bypass (SUSPECTED_BUG — verified by grep that
#      disabledModelsRepo/disabledModelsDb has zero importers under src/sse or
#      open-sse, only the three listing routes)
#   Q5 model list is a single global per-process object (not per-connection),
#      but /v1/models' CLIENT-FACING listing is per-connection and can replace
#      the static list with a live per-account fetch -> catalog.model-registry-global
#      + catalog.model-listing-live-override
#
# Bonus finding while reading the alias CRUD surface: /api/models/alias PUT and
# /api/models PUT both claim to "update model alias" against the same
# `modelAliases` KV scope but pass arguments to setModelAlias(alias, model) in
# opposite order -> catalog.alias-dual-convention-collision (SUSPECTED_BUG).

