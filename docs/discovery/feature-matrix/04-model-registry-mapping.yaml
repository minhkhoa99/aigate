    - { file: src/lib/modelCatalog/sync.js, line: 23, note: "LIMIT_TOLERANCE=0.1 ignore-noise threshold" }
    - { file: src/lib/modelCatalog/sync.js, line: 12, note: "FETCH_TIMEOUT_MS=60000" }
    - { file: src/lib/modelCatalog/sync.js, line: 16, note: "RETRY_DELAY_MS=30 minutes on failure" }
