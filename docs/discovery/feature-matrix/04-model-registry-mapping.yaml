- id: catalog.model-listing-live-override
  group: Model registry
  feature: Model catalog
  subFeature: /v1/models replaces the static per-provider model list with a live per-connection fetch when available, falling back to static on failure
  trigger: "GET /v1/models (or /v1/models/{kind})"
  input: none — reads the caller's own active provider connections
  output: 'OpenAI-format { object:"list", data:[{ id, object, owned_by, capabilities?, context_length?, max_completion_tokens? }] }'
  businessRules:
    - "Only the FIRST active connection per provider id feeds the listing (activeConnectionByProvider Map keyed by provider, first-write-wins) — a second account on the same provider with a different enabledModels allow-list or live catalog is invisible to /v1/models even though account-selection/fallback can still dispatch chat requests to it"
    - "For providers in LIVE_MODEL_RESOLVERS (kiro, qoder, kimchi, github, clinepass, grok-cli, cursor, zed — chosen because they return per-account dynamic model variants) a successful live fetch REPLACES rawModelIds outright rather than merging with PROVIDER_MODELS; on a thrown error, or when the connection has an explicit providerSpecificData.enabledModels allow-list, it falls back to that instead"
    - "OpenAI/Anthropic-compatible custom providers with zero static or enabled models call fetchCompatibleModelIds to hit the account's own {baseUrl}/models endpoint directly — a second, independent live-list source with its own 5s timeout and a recursion-guard header for chained 9router-to-9router calls"
    - "Live-catalog entries usually carry only { id, name } — no capability metadata — so context_length/max_completion_tokens are backfilled from the same static getCapabilitiesForModel(provider, modelId) pattern table used for static models, specifically so a live 372K-context model isn't guessed at a larger static default and silently overruns upstream"
  state:
    reads: ["providerConnections (isActive, providerSpecificData.enabledModels/prefix)", "modelAliases", "customModels", "disabledModels", "PROVIDER_MODELS static table"]
    writes: []
    runtimeOnly: []
  dependencies: ["catalog.model-registry-global", "catalog.capability-tier-fallback"]
  providerInteraction: "Live resolvers call the upstream account's own model-list/session endpoint (Kiro, Qoder, GitHub Copilot, Cursor, etc.); OpenAI/Anthropic-compatible custom providers call {baseUrl}/models directly"
  fallback: { hasFallback: true, retry: null, timeout: "fetchCompatibleModelIds aborts via AbortController after 5000ms", quota: null }
  errorCases:
    - { code: PROVIDER_UNAVAILABLE, when: "a live resolver throws or returns no models", partial: true }
  sideEffects: []
  persistence: []
  performanceConcerns:
    - "One live network round-trip per active provider connection on every /v1/models call — no caching of the live-resolver result (unlike providerModelsFetcher.js's 10-minute in-memory cache for the dashboard-only suggested-models fetch)"
  behavior: { streaming: false, cancellation: "fetchCompatibleModelIds cancels its own request past 5s; a slow live resolver is not otherwise cancelled", concurrency: null }
  edgeCases:
    - "Multiple connections to the same provider: only the first one enumerated by getProviderConnections() feeds the listing; other accounts' enabledModels/live catalogs never surface even though account-selection can route requests to them"
  evidence:
    - { file: src/app/api/v1/models/route.js, line: 289, note: "activeConnectionByProvider.set only when not already present — first connection per provider wins" }
    - { file: src/app/api/v1/models/route.js, line: 385, note: "liveResolver = LIVE_MODEL_RESOLVERS[providerId]" }
    - { file: src/app/api/v1/models/route.js, line: 390, note: "rawModelIds = live.models.map(...) — live list replaces, not merges" }
    - { file: src/app/api/v1/models/route.js, line: 402, note: "catch: live fetch failure falls back to whatever rawModelIds already holds" }
    - { file: src/app/api/v1/models/route.js, line: 197, note: "AbortController 5000ms timeout on fetchCompatibleModelIds" }
    - { file: src/app/api/v1/models/route.js, line: 502, note: "context_length/max_completion_tokens backfilled from static getCapabilitiesForModel when the live entry omits them" }
