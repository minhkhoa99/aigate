    - { file: "src/app/api/mcp/[plugin]/sse/route.js", line: 19, note: "registerSession(plugin, send) — spawns/reuses the child and registers this connection's sender" }
    - { file: "src/app/api/mcp/[plugin]/sse/route.js", line: 21, note: "endpoint handshake frame naming the POST URL with sessionId" }
    - { file: "src/app/api/mcp/[plugin]/message/route.js", line: 14, note: "sendToChild writes the JSON-RPC body to the child's stdin, replies 202" }
    - { file: src/lib/mcp/stdioSseBridge.js, line: 104, note: "comment: only preset stdio plugins may spawn — RCE prevention" }
    - { file: src/lib/mcp/stdioSseBridge.js, line: 109, note: "getOrSpawn reuses one child process per plugin name across all sessions" }
    - { file: src/lib/mcp/stdioSseBridge.js, line: 156, note: "unregisterSession kills the child once the last session disconnects" }
    - { file: src/lib/mcp/stdioSseBridge.js, line: 15, note: "smartFilterText truncates/collapses large tool-result text before broadcast" }
