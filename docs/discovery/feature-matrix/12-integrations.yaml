  performanceConcerns:
    - "The registry cache is a plain globalThis map with no cross-instance sharing and no persistence — a server restart (or, per the module-reevaluation quirk documented elsewhere for Next.js, a fresh module load) means the next request re-fetches all pages from Anthropic"
