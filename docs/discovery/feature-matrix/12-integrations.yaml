- id: clitools.all-statuses-batch
  group: CLI Tools
  feature: Dashboard tool-status aggregation
  subFeature: all-statuses batches 13 per-tool GETs into one response
  trigger: Dashboard "Integrations" page load (or refresh) fetching combined tool status
  input: none (GET, no query params)
  output: "JSON object keyed by toolId → that tool's own GET response body (or null if its handler threw)"
  businessRules:
    - "STATUS_GETTERS re-imports the GET function of exactly 13 of the 19 cli-tools route files (claude, codex, opencode, droid, openclaw, hermes, cowork, cline, kilo, deepseek-tui, jcode, grok-build, devin) and calls each in-process — not over HTTP"
    - "The other 6 route.js files are deliberately excluded: antigravity-mitm and antigravity-mitm/alias (proxy/DNS control, not an installed-tool status card), copilot-settings (no install-detection step to batch — see clitools.copilot-settings-array-upsert), cowork-mcp-registry and cowork-mcp-tools (MCP marketplace helpers, not tool-status cards), and all-statuses itself"
    - "Each per-tool getter is invoked via Promise.all so all 13 run concurrently; a getter that throws is caught per-entry and mapped to null rather than failing the whole batch"
  state: { reads: ["~/.claude/settings.json", "~/.codex/config.toml", "~/.config/opencode/opencode.json", "~/.factory/settings.json", "~/.openclaw/openclaw.json", "~/.hermes/config.yaml", "Claude Desktop configLibrary", "~/.cline/data/globalState.json", "~/.local/share/kilo/auth.json", "~/.deepseek/config.toml", "~/.jcode/config.toml", "~/.grok/config.toml", "devin CLI presence"], writes: [], runtimeOnly: [] }
  dependencies: ["clitools.claude-settings-config"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases:
    - { code: INTERNAL_ERROR, when: "an individual tool's GET handler throws (e.g. unreadable settings file); that tool's slot becomes null, other 12 slots are unaffected", partial: true }
  sideEffects: []
  persistence: []
  performanceConcerns:
    - "Every one of the 13 delegated GETs does its own installed-check first, which on Windows shells out to `where <tool>` (spawns a child process); batching means 13 concurrent process spawns per page load instead of 13 sequential ones if the dashboard had called each route separately over HTTP, but the child-process cost itself is not eliminated"
    - "Q3 answer: the route exists to collapse what would otherwise be 13 separate client-initiated HTTP round trips (each triggering its own `where`/`which` spawn plus file reads) into a single request whose 13 sub-calls run concurrently server-side via Promise.all, instead of being serialized by the browser's per-host connection limit"
  behavior: { streaming: false, cancellation: null, concurrency: "Promise.all — all 13 getters run concurrently, independent of each other" }
  edgeCases:
    - "A change to STATUS_GETTERS (new tool added) requires remembering to also add it here; there is no runtime check that this list stays in sync with the actual route directories"
  evidence:
    - { file: src/app/api/cli-tools/all-statuses/route.js, line: 18, note: "STATUS_GETTERS — exactly 13 of the 19 cli-tools GET handlers re-imported directly" }
    - { file: src/app/api/cli-tools/all-statuses/route.js, line: 36, note: "Promise.all over Object.entries(STATUS_GETTERS): concurrent in-process calls, not 13 HTTP requests" }
    - { file: src/app/api/cli-tools/all-statuses/route.js, line: 41, note: "per-tool try/catch → null on failure, does not fail the whole batch" }
  newModule: tooling
  parityStatus: traced
  labels: [REFERENCE_BEHAVIOR]

- id: clitools.claude-settings-config
  group: CLI Tools
