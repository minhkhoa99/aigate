- id: clitools.write-not-atomic
  group: CLI Tools
  feature: User config file durability
  subFeature: Every cli-tools write is a single non-atomic fs.writeFile with no on-disk backup
  trigger: Any POST/DELETE/PATCH across all 13 write-capable cli-tools routes
  input: "Any tool-config write triggered by that tool's own POST/DELETE/PATCH handler"
  output: "The write either lands intact or, on a mid-write failure, leaves the target file truncated/corrupted with no recovery path"
  businessRules:
    - "Q2 answer: the write is NOT atomic. Every route (claude-settings, cline-settings, codex-settings, copilot-settings, cowork-settings, deepseek-tui-settings, droid-settings, grok-build-settings, hermes-settings, jcode-settings, kilo-settings, openclaw-settings, opencode-settings — including openclaw's per-agent models.json files and cowork's per-instance configLibrary/*.json) calls fs.writeFile(path, content) directly on the FINAL path. None use a temp-file-then-rename swap, and none write a recoverable .bak copy of the previous content"
    - "The codebase already has an atomic-write helper for this exact purpose elsewhere: src/lib/mitmAliasCache.js's writeAtomic() writes to '<file>.tmp' then fs.renameSync()s over the real file — that pattern is simply not used for any of the user's own CLI/IDE config files"
  state: { reads: [], writes: [], runtimeOnly: [] }
  dependencies: []
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases:
    - { code: INTERNAL_ERROR, when: "process dies, disk fills, or power is lost between fs.writeFile's buffer flush and the OS completing the write", partial: true }
  sideEffects: ["Can leave the user's real tool config file truncated or containing invalid JSON/TOML/YAML"]
  persistence: []
  performanceConcerns: []
  behavior: { streaming: false, cancellation: null, concurrency: "No lock: two concurrent Apply calls for the same tool both read-merge-write independently; whichever writeFile lands last silently wins and drops the other request's fields" }
  edgeCases:
    - "Every route's own read path treats a JSON.parse/parseTOML failure as 'no config' (returns null), not as an error — so the read immediately AFTER a corrupted write reports the tool as unconfigured, and the next Apply starts from an empty object, discarding whatever else was in the file before 9router ever touched it"
    - "Two concurrent Apply calls to the same tool race with no lock, since each does read-then-merge-then-write independently"
  evidence:
    - { file: src/app/api/cli-tools/claude-settings/route.js, line: 178, note: "direct fs.writeFile, no temp file, despite the adjacent 'Backup' comment at line 123" }
    - { file: src/app/api/cli-tools/droid-settings/route.js, line: 161, note: "same pattern: read, mutate in memory, single fs.writeFile" }
    - { file: src/app/api/cli-tools/opencode-settings/route.js, line: 162, note: "same pattern" }
    - { file: src/app/api/cli-tools/cline-settings/route.js, line: 97, note: "same pattern, plus a second writeFile for secrets.json two files later with no cross-file transaction" }
    - { file: src/lib/mitmAliasCache.js, line: 15, note: "writeAtomic() — temp file + fs.renameSync — the atomic pattern that exists in this codebase but is not applied to any user CLI config write" }
  newModule: tooling
  parityStatus: traced
  labels: [SUSPECTED_BUG]
  suspicion:
    expected: "Given every one of these writes targets the user's own IDE/CLI configuration file (not 9router's own data), and one of the affected routes' own comment explicitly promises 'Backup old fields and write new settings', a crash mid-write should not be able to corrupt or truncate that file — either via a temp-file-then-rename swap (the exact pattern already implemented in this codebase at src/lib/mitmAliasCache.js:15-21 for 9router's own alias cache) or an actual on-disk backup copy."
    actual: "All 13 write-capable cli-tools routes call fs.writeFile(path, content) directly on the final path with no temp file, no rename, and no backup copy anywhere on disk. The 'backup' language in the claude-settings POST comment refers only to merging the previously-read JSON object in memory before the single overwrite call — nothing is preserved outside process memory."
    impact: "A crash, OOM kill, disk-full error, or power loss during any of these writes can truncate or corrupt the user's real tool config (e.g. ~/.claude/settings.json, ~/.codex/config.toml, ~/.openclaw/openclaw.json). Because every route's read path treats an unparseable file as simply 'no config', the damage is silent: the next status check reports the tool as unconfigured, and the next Apply starts from empty, permanently discarding whatever unrelated settings that file held before 9router wrote to it."

- id: clitools.baseurl-v1-suffix-normalization
  group: CLI Tools
  feature: Base URL normalisation for CLI tool configs
  subFeature: Each POST handler independently appends (or strips) a literal "/v1" suffix before writing baseUrl
  trigger: Every write-capable cli-tools POST handler, before the baseUrl value is written into that tool's own config format
  input: "baseUrl string supplied by the dashboard (normally the 9router base URL the user is pointing the tool at)"
  output: "baseUrl string with (or without) a trailing /v1, as that specific tool's config format expects"
  businessRules:
    - "Q4 rule, reimplemented independently (not shared code) in at least 9 route files: `baseUrl.endsWith(\"/v1\") ? baseUrl : baseUrl + \"/v1\"`. Because the check is an exact suffix match, re-running Apply on a baseUrl that already ends in /v1 is a no-op — nothing extra is appended. That is the direct answer to 'what breaks if a base URL already ends in /v1': nothing, the check is idempotent for the exact string"
    - "cline-settings does the INVERSE (`endsWith(\"/v1\") ? baseUrl.slice(0, -3) : baseUrl`) because, per its own comment, 'Cline expects base WITHOUT /v1'"
    - "This is a client-config-generation concern only — separate from how 9router's own executor builds its OUTBOUND upstream URLs. That path (open-sse/executors/base.js, see routing.build-url in 05-routing-and-fallback.yaml) does a single-trailing-slash strip and appends an endpoint path with NO /v1 detection at all; the two normalisation rules exist for unrelated reasons and must not be conflated during parity design"
  state: { reads: [], writes: [], runtimeOnly: [] }
  dependencies: ["routing.build-url"]
  providerInteraction: null
  fallback: { hasFallback: false, retry: null, timeout: null, quota: null }
  errorCases: []
  sideEffects: []
  persistence: []
  performanceConcerns: []
  behavior: { streaming: false, cancellation: null, concurrency: null }
  edgeCases:
    - "endsWith(\"/v1\") is a literal match: a trailing-slash variant like \"http://localhost:20128/v1/\" does not match, so the append branch fires anyway, producing \"http://localhost:20128/v1//v1\" — a broken double-suffixed URL. The same risk applies to cline's inverse check on a trailing-slash variant"
    - "The rule is copy-pasted independently into claude-settings, codex-settings, droid-settings, opencode-settings, grok-build-settings, hermes-settings, jcode-settings, deepseek-tui-settings and kilo-settings rather than shared — a future change to the rule has to be made in 9 places"
  evidence:
    - { file: src/app/api/cli-tools/claude-settings/route.js, line: 154, note: "endsWith(/v1) ? keep : append — canonical form of the rule" }
    - { file: src/app/api/cli-tools/cline-settings/route.js, line: 88, note: "comment: Cline expects base WITHOUT /v1" }
    - { file: src/app/api/cli-tools/cline-settings/route.js, line: 89, note: "inverse rule: strip trailing /v1 via slice(0, -3) when present" }
    - { file: src/app/api/cli-tools/codex-settings/route.js, line: 137, note: "same append rule, comment 'Ensure /v1 suffix is added only once'" }
    - { file: src/app/api/cli-tools/droid-settings/route.js, line: 118, note: "same append rule" }
    - { file: src/app/api/cli-tools/deepseek-tui-settings/route.js, line: 56, note: "same append rule inside build9RouterConfig" }
  newModule: tooling
  parityStatus: traced
  labels: [REFERENCE_BEHAVIOR]

