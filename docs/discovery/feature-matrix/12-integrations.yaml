    - { code: INTERNAL_ERROR, when: "unexpected fs/TOML error", partial: false }
  sideEffects: ["API key stored in cleartext inside config.toml, a non-secrets file"]
  persistence: ["~/.codex/config.toml", "~/.codex/auth.json"]
  performanceConcerns: []
  behavior: { streaming: false, cancellation: null, concurrency: null }
